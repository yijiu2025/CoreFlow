<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport：**单行 + 只留最通用的键** —— 写的键越"先进"，被整条丢弃的概率越高。
         两次真机实测的教训：
           ① 跨 4 行书写            → 小米浏览器整条丢弃；
           ② 带实验键 interactive-widget=resizes-content → 夸克浏览器整条丢弃。
         两者都退化成「桌面站点式」渲染：布局视口 980px，再把整页等比缩放到屏幕宽度
         （缩放比 = 物理宽 / 980，夸克实测 1.2245 倍）。症状**不是**"多一条色带"，
         而是**比例整个错掉**：字与控件被缩到 1/2.45（字段高 144 → 58.8 物理 px）、
         字段却横向拉满 → 又扁又小。
         键盘避让不再依赖那个实验键：focus 时由 useKeyboardAvoid 把字段滚进可视区。
         viewport-fit=cover：页面铺满刘海屏，env(safe-area-inset-*) 才拿得到真实值。
         万一某个内核连这条最简写法也丢，由 src/utils/viewport-fix.ts 兜住整页比例。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Enterprise SSO Login</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;600;700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
