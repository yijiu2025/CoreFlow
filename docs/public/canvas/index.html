<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCanvas · 后端函数调用图</title>
<style>
  :root {
    --bg: #f2f4f7; --panel: #ffffff; --line: #e2e6ec; --text: #252d3a; --text2: #7d8794;
    --accent: #2f6fe4; --shadow: 0 1px 3px rgba(24,34,52,.07), 0 4px 14px rgba(24,34,52,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font: 13px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); background: var(--bg); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased; }

  /* ---------- 加载遮罩 ---------- */
  #loading { position: fixed; inset: 0; z-index: 99; background: var(--bg); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #loading .ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #dbe2ec;
    border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .tip { color: var(--text2); font-size: 12.5px; }

  /* ---------- 顶栏 ---------- */
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: 0 0 auto; position: relative; z-index: 30; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand .logo { width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
    background: linear-gradient(135deg, #2f6fe4, #7b3fe4); position: relative; }
  .brand .logo::after { content: ""; position: absolute; inset: 6px; border: 2px solid #fff; border-radius: 3px; }
  .brand .sub { font-weight: 400; font-size: 11.5px; color: var(--text2); margin-left: 2px; }
  #searchWrap { position: relative; flex: 0 1 320px; }
  #search { width: 100%; padding: 6px 12px 6px 30px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; outline: none; background: var(--bg); transition: border-color .15s, background .15s; }
  #search:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(47,111,228,.12); }
  #searchIcon { position: absolute; left: 9px; top: 7px; color: var(--text2); font-size: 12px; pointer-events: none; }
  #searchResults { position: absolute; top: 36px; left: 0; right: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,30,50,.16);
    max-height: 320px; overflow: auto; display: none; z-index: 40; }
  #searchResults .item { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between;
    gap: 10px; align-items: baseline; }
  #searchResults .item:hover, #searchResults .item:hover .file { background: #eef4ff; color: var(--accent); }
  #searchResults .item .file { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 4px 11px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--text2); white-space: nowrap; transition: all .15s; }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(24,34,52,.14); }
  .seg button.on[data-k="import"] { color: #c47314; }
  .seg button.on[data-k="local"] { color: #3b6fc4; }
  .seg button.on[data-k="ref"] { color: #2f8f5b; }
  .seg button.on[data-k="guess"] { color: #6b7690; }
  .seg button.on[data-k="var"] { color: #7a5cc4; }
  .seg button.on[data-k="env"] { color: #2380b8; }
  .seg button.on[data-k="log"] { color: #b05690; }
  .seg button.on[data-k="boot"] { color: #c05e1f; }
  .btn.boot-btn { color: #b8561c; border-color: #f0d3bb; background: #fdf5ec; }
  .btn.boot-btn:hover { border-color: #dd7533; background: #fcecdd; }
  .btn.boot-btn.playing { background: #dd7533; border-color: #dd7533; color: #fff; }
  .seg button { padding: 4px 8px; }
  #toolbar .btn { padding: 6px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    cursor: pointer; font: inherit; font-size: 12.5px; white-space: nowrap; transition: all .15s; }
  #toolbar .btn:hover { border-color: var(--accent); color: var(--accent); }
  #stats { margin-left: auto; color: var(--text2); font-size: 12px; white-space: nowrap; }
  #stats b { color: var(--text); font-weight: 600; }

  /* ---------- 主体 ---------- */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #sidebar { flex: 0 0 262px; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 10px 0 6px; display: flex; flex-direction: column; }
  #sidebar .side-title { padding: 2px 14px 8px; font-size: 11px; font-weight: 600; color: var(--text2);
    letter-spacing: .08em; text-transform: uppercase; }
  .grp { padding: 5px 14px; cursor: default; display: flex; align-items: center; gap: 8px; user-select: none; }
  .grp:hover { background: #f4f6fa; }
  .grp input { accent-color: var(--accent); flex: 0 0 auto; }
  .grp .gdot { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
  .grp .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .grp .name:hover { color: var(--accent); }
  .grp .cnt { color: var(--text2); font-size: 10.5px; white-space: nowrap; }
  /* 目录树（模块 → 文件夹 → 文件，每级可勾选） */
  #sidebar .side-head { display: flex; align-items: center; gap: 6px; padding: 2px 12px 7px; }
  #sidebar .side-head .t { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: .08em; }
  #sidebar .side-head .acts { margin-left: auto; display: flex; gap: 4px; }
  #sidebar .side-head .acts button { border: 1px solid var(--line); background: #fff; color: var(--text2);
    border-radius: 6px; padding: 1px 6px; font: inherit; font-size: 10.5px; cursor: pointer; }
  #sidebar .side-head .acts button:hover { color: var(--accent); border-color: var(--accent); }
  .tro { display: flex; align-items: center; gap: 5px; padding: 2.5px 10px 2.5px 6px; font-size: 12px;
    user-select: none; cursor: default; }
  .tro:hover { background: #f4f6fa; }
  .tro input { accent-color: var(--accent); margin: 0; flex: 0 0 auto; width: 12px; height: 12px; }
  .tro .tw { width: 11px; flex: 0 0 auto; text-align: center; color: #b3bcc9; font-size: 9px; cursor: pointer; }
  .tro .tw:hover { color: var(--accent); }
  .tro .gdot { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .tro .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .tro .tname:hover { color: var(--accent); text-decoration: underline; }
  .tro .tcnt { color: var(--text2); font-size: 10px; white-space: nowrap; }
  .tro.lv0 { font-weight: 600; }
  .tro.lv1 { color: #55606e; }
  .tro.lv2 { color: #75808f; }
  .tro.off .tname, .tro.off .tcnt { opacity: .45; }
  .legend { margin-top: auto; padding: 12px 14px 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text2); }
  .legend b { display: block; font-size: 10.5px; letter-spacing: .08em; color: var(--text2); margin-bottom: 7px; }
  .legend .li { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .legend .sw { width: 22px; height: 0; border-top: 2px solid; flex: 0 0 auto; }
  .legend .sw.dash { border-top-style: dashed; }
  .legend .sw.dot { width: 9px; height: 9px; border: none; border-radius: 3px; margin: 0 6px 0 1px; }

  #viewport { flex: 1; position: relative; overflow: hidden; cursor: grab;
    background: radial-gradient(circle, #d7dce4 1px, transparent 1px); background-size: 24px 24px; }
  #viewport.dragging { cursor: grabbing; }

  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 0; height: 0; }
  #edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
    transform-origin: 0 0; }
  /* 启动演示的跑马灯层：只画流动光点与拖尾，每帧重绘成本极低（不碰主画布） */
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  #world { z-index: 1; }
  #zoombar, #hint { z-index: 20; }
  #detail { z-index: 21; }
  #chainChip { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; z-index: 22;
    background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 4px 18px rgba(25,40,70,.14); padding: 7px 16px; font-size: 12px; color: var(--text);
    white-space: nowrap; pointer-events: none; }
  #chainChip b { color: var(--accent); }
  /* 演示运行列表：右侧半透明悬浮窗 */
  #tourPanel { position: absolute; right: 14px; top: 62px; width: 286px; z-index: 24; display: none;
    max-height: calc(100% - 84px); flex-direction: column;
    background: rgba(255,255,255,.86); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border: 1px solid #edd9c8; border-radius: 14px; box-shadow: 0 10px 30px rgba(25,40,70,.16);
    font-size: 12px; color: var(--text); overflow: hidden; }
  #tourPanel.on { display: flex; }
  #tourPanel .tp-head { display: flex; align-items: center; gap: 7px; padding: 10px 12px 6px; }
  #tourPanel .tp-ico { font-size: 13px; }
  #tourPanel .tp-title { font-weight: 600; color: #b8561c; }
  #tourPanel .tp-count { margin-left: auto; color: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; }
  #tourPanel .tp-sub { padding: 0 12px 7px; color: var(--text2); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tourPanel .tp-bar { position: relative; height: 3px; margin: 0 12px; border-radius: 2px; background: #f1e4d9; overflow: hidden; }
  #tourPanel .tp-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #dd7533; transition: width .2s linear; }
  #tourPanel .tp-acts { display: flex; gap: 5px; padding: 9px 12px 8px; border-bottom: 1px solid rgba(237,217,200,.7); }
  #tourPanel .tp-acts button { flex: 1; border: 1px solid var(--line); background: #fff; color: var(--text2);
    border-radius: 8px; padding: 3px 0; font: inherit; font-size: 11px; cursor: pointer; }
  #tourPanel .tp-acts button:hover { color: #c05e1f; border-color: #dd7533; }
  #tourPanel .tp-list { overflow-y: auto; padding: 4px 0 6px; scrollbar-width: thin; }
  #tourPanel .tp-pick { display: none; overflow-y: auto; padding: 4px 0 6px; scrollbar-width: thin; }
  #tourPanel.picking .tp-list { display: none; }
  #tourPanel.picking .tp-pick { display: block; }
  #tourPanel .tp-pick .pk-head { padding: 2px 12px 6px; color: var(--text2); font-size: 10.5px; }
  #tourPanel .tp-row.pick .f { color: #3d4859; }
  #tourPanel .tp-row.pick:hover .f { color: #b8561c; }
  #tourPanel .tp-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 12px 3px 10px;
    cursor: pointer; border-left: 2px solid transparent; }
  #tourPanel .tp-row:hover { background: rgba(253,240,230,.9); }
  #tourPanel .tp-row .n { color: #b3bcc9; font-size: 10px; font-variant-numeric: tabular-nums;
    min-width: 20px; text-align: right; flex: 0 0 auto; }
  #tourPanel .tp-row .f { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tourPanel .tp-row .d { color: #c9a68c; font-size: 9.5px; flex: 0 0 auto; }
  #tourPanel .tp-row.cur { background: #fdf0e6; border-left-color: #dd7533; }
  #tourPanel .tp-row.cur .f { color: #b8561c; font-weight: 600; }
  #tourPanel .tp-row.cur .n { color: #dd7533; }
  #tourPanel .tp-done { padding: 7px 12px; color: #b8561c; font-size: 11px; }
  /* 当前正在执行的函数：脉动一次 */
  .fn-node.walking { box-shadow: 0 0 0 2px #dd7533, 0 0 16px rgba(221,117,51,.5) !important; z-index: 6; }
  .fn-node.walking .nn { color: #b8561c; }
  #chainChip .cx { color: #a8b1bd; font-size: 10.5px; }
  #edges path { fill: none; stroke: #b6c0cf; stroke-width: 1.2; }
  #edges path.k-import { stroke: #e0912f; stroke-opacity: .32; }
  #edges path.k-guess { stroke: #c5ccd8; stroke-opacity: .6; stroke-dasharray: 5 4; }
  #edges path.k-local { stroke: #7ea4dd; stroke-opacity: .6; }
  #edges path.k-ref { stroke: #3ba55d; stroke-opacity: .55; stroke-dasharray: 2 3; }
  /* 箭头只在近景（>=50%）或选中时挂载 —— 全量 marker 会让平移掉到 100ms/帧 */
  #world.arrowed #edges path.k-import { marker-end: url(#ar-import); }
  #world.arrowed #edges path.k-guess { marker-end: url(#ar-guess); }
  #world.arrowed #edges path.k-local { marker-end: url(#ar-local); }
  #world.arrowed #edges path.k-ref { marker-end: url(#ar-ref); }
  #world.far #edges path { stroke-width: 1; }
  #world.far #edges path.k-import { stroke-opacity: .2; }
  #edges path.lit { stroke: var(--accent); stroke-width: 2.4; stroke-opacity: 1; marker-end: url(#ar-lit); }
  #world.dim #edges path:not(.lit) { opacity: .07; }
  #world.dim .fn-node:not(.lit) { opacity: .14; }
  #world.dim .box:not(.lit) { opacity: .15; }
  /* LOD：缩小到全览时隐藏函数节点，只留文件框（大幅降低渲染量） */
  #world.far .fn-node { display: none; }
  #world.far .cont .ctitle { font-size: 11px; }

  /* ---------- 四级容器：模块 / 文件夹 ---------- */
  #layerContainers, #layerBoxes, #layerNodes { position: absolute; left: 0; top: 0; }
  .cont { position: absolute; border-radius: 16px; box-sizing: border-box; }
  .cont.mcont { border: 2px solid hsl(var(--hue),42%,72%); background: hsl(var(--hue),48%,97.2%);
    box-shadow: 0 2px 14px rgba(25,40,70,.05); }
  .cont.fcont { border: 1.5px dashed hsl(var(--hue),34%,80%); background: rgba(255,255,255,.42); border-radius: 12px; }
  .cont .ctitle { position: absolute; left: 12px; top: 6px; right: 12px; display: flex; align-items: baseline;
    gap: 8px; white-space: nowrap; overflow: hidden; }
  .cont .ctitle .cname { font-size: 13px; font-weight: 700; color: hsl(var(--hue),44%,38%);
    background: hsl(var(--hue),62%,93%); padding: 1px 9px; border-radius: 6px; }
  .cont .ctitle .cmeta { font-size: 10.5px; color: hsl(var(--hue),18%,52%); }
  .cont.mcont > .ctitle { cursor: pointer; user-select: none; }
  .cont.mcont .foldarrow { font-size: 10px; opacity: .6; margin-right: 3px; }
  .cont.mcont.collapsed { border-style: dashed; }
  .cont.mcont.collapsed > .ctitle { line-height: 26px; }
  .cont.gcont { border: 2px solid hsl(var(--hue),36%,76%); background: hsl(var(--hue),42%,98.8%);
    box-shadow: 0 2px 18px rgba(25,40,70,.04); }
  .cont.gcont > .ctitle { cursor: pointer; user-select: none; }
  .cont.mcont > .ctitle, .cont.fcont > .ctitle, .cont.gcont > .ctitle { cursor: move; }
  .cont.fcont .ctitle { left: 8px; top: 2px; }
  .cont.fcont .ctitle .cname { font-size: 11px; font-weight: 600; background: hsl(var(--hue),40%,95%);
    color: hsl(var(--hue),32%,42%); padding: .5px 7px; }
  .cont.fcont .ctitle .cmeta { font-size: 9.5px; }
  #world.dim .cont { opacity: .4; }
  #world.far .cont.fcont { border-style: solid; }

  /* 变量 / 存储方框 */
  .fn-node.vnode { background: #fbfaff; border-style: dashed; }
  .fn-node.vnode.v-storage { background: #f5fbfa; border-color: #b7e0da !important; border-left-color: #2fa89a !important; }
  .fn-node.vnode .vtype { font-size: 9px; color: #7b8494; background: #eef1f5; border-radius: 4px; padding: 0 4px; }
  .fn-node.vnode.v-storage .vtype { color: #1f7f75; background: #e2f3f1; }
  #edges path.k-var { stroke: #8b6fd4; stroke-opacity: .5; stroke-dasharray: 4 3; }
  #world.arrowed #edges path.k-var { marker-end: url(#ar-var); }

  .box { position: absolute; background: rgba(255,255,255,.88); border: 1.5px solid; border-radius: 10px;
    box-shadow: var(--shadow); }
  #world.showLocal .box { background: rgba(255,255,255,.35); box-shadow: none; }
  .box-head { position: absolute; left: 0; top: 0; right: 0; height: 28px; display: flex; align-items: center;
    gap: 6px; padding: 0 10px; border-radius: 8.5px 8.5px 0 0; cursor: grab; user-select: none; }
  .box-head:active { cursor: grabbing; }
  .box-head .fold { width: 17px; height: 17px; line-height: 15px; text-align: center; border-radius: 5px;
    font-size: 11px; color: var(--text2); background: rgba(255,255,255,.85); cursor: pointer; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); }
  .box-head .fold:hover { color: var(--text); background: #fff; }
  .box-head { cursor: pointer; }
  .box.is-collapsed { border-style: dashed; background: rgba(255,255,255,.72); }
  .box.is-collapsed .box-head { border-radius: 9px; }
  .box-head .fname { flex: 1; font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .box-head .fmeta { font-size: 10px; opacity: .65; white-space: nowrap; }
  .box.ghead { position: absolute; border: none; box-shadow: none; background: transparent; }
  .box.ghead .gtxt { display: inline-flex; align-items: center; gap: 7px; padding: 4px 13px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .02em; cursor: pointer; white-space: nowrap; }
  .box.ghead .gtxt .n { font-weight: 400; opacity: .7; font-size: 11px; }

  .fn-node { position: absolute; background: #fff; border: 1px solid; border-left-width: 3px; border-radius: 6px;
    padding: 2px 7px; font-size: 11.5px; cursor: grab; user-select: none; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; transition: box-shadow .12s; }

  /* ---------- ComfyUI 风格节点卡片（左右端口） ---------- */
  .fn-node.card { padding: 0; display: block; overflow: visible; border-radius: 7px;
    box-shadow: 0 1px 3px rgba(25,40,70,.07); background: #fff; }
  .fn-node.card .nh { display: flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px;
    border-radius: 6px 6px 0 0; background: hsl(var(--hue, 215), 42%, 96%); border-bottom: 1px solid hsl(var(--hue, 215), 30%, 90%); }
  .fn-node.card .nh .nn { font-size: 10.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .fn-node.card .nh .nl { font-size: 9px; color: #9aa4b2; flex: 0 0 auto; }
  .fn-node.card .nb { position: relative; }
  .fn-node.card .port { position: absolute; height: 14px; line-height: 14px; font-size: 9.5px; color: #5b6675;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fn-node.card .port.pin { left: 8px; right: 48%; text-align: left; }
  .fn-node.card .port.pout { right: 8px; left: 48%; text-align: right; }
  .fn-node.card .port i { position: absolute; top: 4px; width: 6px; height: 6px; border-radius: 50%;
    background: #fff; border: 1.5px solid #9aa4b2; }
  .fn-node.card .port.pin i { left: -7px; }
  .fn-node.card .port.pout i { right: -7px; }
  .fn-node.card .port.pin i.on { border-color: #e0912f; background: #fdf0dd; }
  .fn-node.card .port.pout i.on { border-color: #6f9de0; background: #dce9fb; }
  .fn-node.card .port.more span { color: #a8b1bd; font-style: italic; }
  .fn-node.card .port .ph { color: #c0c7d2; font-style: italic; font-size: 9px; }
  .fn-node.card.lit .port i { border-color: var(--accent); background: #dbe7fb; }
  .fn-node:hover { box-shadow: 0 2px 10px rgba(30,50,90,.18); z-index: 3; }
  .fn-node .ln { color: var(--text2); font-size: 10px; margin-left: auto; flex: 0 0 auto; }
  .fn-node .exp { color: #2f9e63; font-size: 9px; flex: 0 0 auto; }
  .fn-node .k { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 2.5px; }
  .k-function { background: #6f9de0; } .k-async { background: #9b7fe0; } .k-arrow { background: #45b3bf; } .k-method { background: #e0a54f; }
  .k-class { background: #2f9e8f; }
  .fn-node .nh .km { color: #2f9e8f; font-weight: 600; margin-right: 4px; }
  /* class 节点：一个整体框（方法都收进去了），用左侧粗边区分 */
  .fn-node.card.k-class-node { border-left-width: 4px; border-left-color: #2f9e8f; background: #f6fbfa; }
  .fn-node.card.k-class-node .fname, .fn-node.card.k-class-node .nm { color: #1f6f65; }
  .fn-node.lit { box-shadow: 0 0 0 2px var(--accent), 0 2px 10px rgba(30,50,90,.2); z-index: 4; }
  .fn-node.pulse, .box.pulse { animation: pulse 1.1s ease-out 2; }

<body>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.CANVAS_DATA;
  const $ = (s) => document.querySelector(s);

  // ---------- 索引 ----------
  const fnById = new Map(D.functions.map((f) => [f.id, f]));
  const fileById = new Map(D.files.map((f) => [f.id, f]));
  const varById = new Map((D.variables || []).map((v) => [v.id, v]));
  const folderById = new Map((D.folders || []).map((f) => [f.id, f]));
  const groupById = new Map(D.groups.map((g) => [g.id, g]));
  const sortedGroups = [...D.groups].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999) || a.name.localeCompare(b.name));
  sortedGroups.forEach((g, i) => { groupById.get(g.id).hue = Math.round(i * 137.508) % 360; });
  const groupVisible = new Map(D.groups.map((g) => [g.id, true]));
  const hiddenFiles = new Set();  // 目录树里取消勾选的文件（隐藏其框/节点/相关边）
  // 端点 → 所属文件（用于判断边是否该隐藏）
  const fileOfEnd = (id) => (id.startsWith('file:') ? id.slice(5) : (fnById.get(id)?.file ?? varById.get(id)?.file ?? null));
  const anyFileVisible = (files) => (files || []).some((fid) => !hiddenFiles.has(fid));
  const collapsedGroups = new Set(); // 已折叠的模块（点击模块标题栏切换，整体重排）
  const foldedFiles = new Set();     // 已折叠的文件（点击文件标题栏 / – 按钮切换，重建后保留）

  const nodeEdges = new Map();
  D.calls.forEach((c, i) => {
    for (const end of [c.f, c.t]) {
      if (!nodeEdges.has(end)) nodeEdges.set(end, []);
      nodeEdges.get(end).push(i);
    }
  });
  // 函数级 入/出 度数（文件详情卡用）
  const fnIn = new Map(), fnOut = new Map();
  for (const c of D.calls) {
    fnIn.set(c.t, (fnIn.get(c.t) || 0) + 1);
    fnOut.set(c.f, (fnOut.get(c.f) || 0) + 1);
  }

  // ---------- 布局参数 ----------
  const COL_W = 250, GAP_X = 40, GAP_Y = 16, HEAD_H = 26, FN_H = 22, PAD_B = 8;
  const TARGET_H = 5200, MAX_ROW_W = 14000; // LPT 贪心装箱：列高均衡，画布比例贴近屏幕
  const LOD = 0.15; // 低于该缩放只显示文件框

  const fnPos = new Map();   // fnId -> {x,y,w,h,el,home,shown}
  const boxPos = new Map();  // fileId -> {x,y,w,h,el,headEl,collapsed,fnIds,group,shown}
  const edges = [];          // {f,t,k,gf,gt,el,bbox,shown}
  const filters = { import: true, local: true, guess: true, ref: true, var: true, env: true, log: true, boot: true };

  // ComfyUI 节点尺寸：标题 18 + 端口行 14×行数
  const NODE_HEAD = 17, PORT_H = 13, MAXP = 4, VAR_H = 19, NODE_GAP = 3;
  const inL = new Map(), outL = new Map(); // 边对象按端点索引（端口偏移挂在边对象上）
  const portRows = (n) => (n ? Math.min(n, MAXP) + (n > MAXP ? 1 : 0) : 0);
  const nodeRows = (id) => Math.max(1, portRows((inL.get(id) || []).length), portRows((outL.get(id) || []).length));
  const fnNodeH = (id) => NODE_HEAD + nodeRows(id) * PORT_H + 4;
  function labelOfNode(id) {
    if (id.startsWith('file:')) return '📄 ' + (fileById.get(id.slice(5))?.name ?? '?');
    if (id.startsWith('var:')) return varById.get(id)?.name ?? id;
    return fnById.get(id)?.name ?? id;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---------- 构建（四级容器：模块 → 文件夹 → 文件 → 函数/变量方框） ----------
  const M_TITLE = 28, M_PAD = 12, F_TITLE = 20, F_PAD = 8;
  const G_PAD = 16, G_TOP = M_TITLE + 10; // api 业务域外框的内边距与标题高
  const isApiGroup = (id) => id === 'api' || id.startsWith('api/');
  const NODE_W = 196, COL_GAP = 18, PAD_X = 6;   // 文件内网格：列宽/列间距（留过线空间）
  const FOLDER_MAX_W = 3000, MODULE_MAX_W = 6200;
  // ---------- 位置偏移：拖动模块 / 文件夹 / 文件框后可持久保存 ----------
  const OFF_KEY = 'codecanvas:offsets:v1';
  const offStore = (() => {
    try {
      const r = JSON.parse(localStorage.getItem(OFF_KEY) || 'null');
      if (r && r.module && r.folder && r.box) return r;
    } catch (e) { /* 忽略坏数据 */ }
    return { module: {}, folder: {}, box: {} };
  })();
  function saveOffsets() { try { localStorage.setItem(OFF_KEY, JSON.stringify(offStore)); } catch (e) {} }
  const bumpOff = (bucket, key, dx, dy) => {
    const cur = bucket[key] || [0, 0];
    bucket[key] = [+(cur[0] + dx).toFixed(1), +(cur[1] + dy).toFixed(1)];
  };
  const moduleBounds = new Map(); // groupId -> {x,y,w,h,el,shown}
  const folderBounds = new Map(); // folderId -> {x,y,w,h,group,el,shown}
  const fileLayouts = new Map();  // fileId -> {w,h,cols,hOf}

  // 文件内节点排序：按「调用深度」分层（调用方深度小、被调方深度大），再按行号
  // → 切列后绝大多数边都从右列流向左列，不会同列上下互连
  const orderCache = new Map();
  function orderFileNodes(file) {
    if (orderCache.has(file.id)) return orderCache.get(file.id);
    const ids = file.fns.concat(file.vars || []);
    const idset = new Set(ids);
    const lineOf = (id) => (id.startsWith('var:') ? (varById.get(id)?.line ?? 0) : (fnById.get(id)?.line ?? 0));

    const out = new Map();
    const indeg = new Map(ids.map((id) => [id, 0]));
    for (const c of D.calls) {
      if (!idset.has(c.f) || !idset.has(c.t)) continue;
      if (c.k !== 'local' && c.k !== 'var') continue;
      if (!out.has(c.f)) out.set(c.f, []);
      out.get(c.f).push(c.t);
      indeg.set(c.t, (indeg.get(c.t) || 0) + 1);
    }

    // 最长路径分层（Kahn）；成环的节点最后统一定为 maxD+1
    const depth = new Map(ids.map((id) => [id, 0]));
    const left = new Map(indeg);
    const queue = ids.filter((id) => (left.get(id) || 0) === 0);
    for (const q of queue) depth.set(q, 0);
    while (queue.length) {
      const cur = queue.shift();
      for (const t of out.get(cur) ?? []) {
        depth.set(t, Math.max(depth.get(t) || 0, (depth.get(cur) || 0) + 1));
        const d = (left.get(t) || 0) - 1;
        left.set(t, d);
        if (d === 0) queue.push(t);
      }
    }
    let maxD = 0;
    for (const d of depth.values()) maxD = Math.max(maxD, d);
    for (const id of ids) if ((left.get(id) || 0) > 0) depth.set(id, maxD + 1); // 环内节点沉底

    const order = ids.slice().sort((a, b) => (depth.get(a) - depth.get(b)) || (lineOf(a) - lineOf(b)));
    orderCache.set(file.id, order);
    return order;
  }

  // 每个文件的网格布局：按深度顺序切成若干列（列间留出布线空间）→ 文件框呈横长方形
  function fileLayout(fid) {
    if (fileLayouts.has(fid)) return fileLayouts.get(fid);
    const file = fileById.get(fid);
    const ids = orderFileNodes(file);
    const hOf = (id) => (id.startsWith('var:') ? VAR_H : fnNodeH(id)) + NODE_GAP;
    const totalH = ids.reduce((sum, id) => sum + hOf(id), 0) || 1;
    const nCols = Math.min(4, Math.max(1, Math.ceil(ids.length / 7)));
    const cols = Array.from({ length: nCols }, () => []);
    const target = totalH / nCols;
    let ci = 0, acc = 0;
    for (const id of ids) {
      if (ci < nCols - 1 && acc >= target * (ci + 1)) ci++;
      cols[ci].push(id);
      acc += hOf(id);
    }
    const colH = cols.map((c) => c.reduce((sum, id) => sum + hOf(id), 0));
    const L = {
      cols, hOf,
      w: nCols * NODE_W + (nCols - 1) * COL_GAP + 2 * PAD_X,
      h: ids.length ? HEAD_H + 6 + Math.max(1, ...colH) : HEAD_H + 26,
      empty: ids.length === 0,
    };
    fileLayouts.set(fid, L);
    return L;
  }

  // 列装箱：把方块放进多列，列高尽量均衡；列内按名字排序，读起来整齐
  function packColumns(items, gapY, nCols) {
    const cols = Array.from({ length: nCols }, () => ({ items: [], h: 0, w: 0 }));
    const ranked = items.length > 0 && items.every((it) => it.rank != null);
    if (ranked) {
      // 重要性序：按给定顺序填列，列高达到均值即换列 → 阅读顺序严格从上到下
      const target = items.reduce((sum, it) => sum + it.h + gapY, 0) / nCols;
      let ci = 0;
      for (const it of items) {
        const c = cols[ci];
        c.items.push(it);
        c.h += it.h + gapY;
        c.w = Math.max(c.w, it.w);
        if (ci < nCols - 1 && c.h >= target) ci++;
      }
    } else {
      for (const it of items.slice().sort((a, b) => b.h - a.h)) {
        const c = cols.reduce((a, b) => (a.h < b.h ? a : b));
        c.items.push(it);
        c.h += it.h + gapY;
        c.w = Math.max(c.w, it.w);
      }
    }
    for (const c of cols) c.items.sort(ranked ? (a, b) => a.rank - b.rank : (a, b) => (a.name || '').localeCompare(b.name || ''));
    return { cols, w: cols.reduce((sum, c) => sum + c.w, 0) + (nCols - 1) * 14, h: Math.max(1, ...cols.map((c) => c.h - gapY)) };
  }

  function build() {
    // 可重入：模块折叠/展开后清空状态整体重排
    // 演示进行中：先把"已点亮"的边记成 f>t 的 key，重建后还原 —— edges 是新建对象，lit 会丢
    const litKeys = new Set();
    for (const e of edges) if (e.lit) litKeys.add(e.f + '>' + e.t);
    edges.length = 0; outL.clear(); inL.clear();
    fnPos.clear(); boxPos.clear(); moduleBounds.clear(); folderBounds.clear();
    world.classList.remove('dim'); chainChip.style.display = 'none'; detail.style.display = 'none';
    const contEl = $('#layerContainers'), boxesEl = $('#layerBoxes'), nodesEl = $('#layerNodes');
    contEl.innerHTML = ''; boxesEl.innerHTML = ''; nodesEl.innerHTML = ''; // 清空旧 DOM，避免重建时叠加副本
    const fragC = document.createDocumentFragment(), fragB = document.createDocumentFragment(), fragN = document.createDocumentFragment();

    // 先建边对象（节点渲染时把端口 y 偏移写回边对象；连线由 canvas 绘制）
    for (const c of D.calls) {
      const e = { f: c.f, t: c.t, k: c.k, l: c.l ?? null, gf: groupOfId(c.f), gt: groupOfId(c.t), pfRel: null, ptRel: null, lit: false };
      edges.push(e);
      if (!outL.has(e.f)) outL.set(e.f, []);
      outL.get(e.f).push(e);
      if (!inL.has(e.t)) inL.set(e.t, []);
      inL.get(e.t).push(e);
    }

    // ① 文件夹内：文件按行铺开（宽度超限换行）
    const plan = new Map();
    for (const fo of D.folders) {
      const fileIds = fo.files.slice().sort((a, b) => a.localeCompare(b));
      const rel = new Map();
      let fx = 0, fy = 0, rowH = 0, maxW = 0;
      for (const fid of fileIds) {
        const L = fileLayout(fid);
        if (fx > 0 && fx + L.w > FOLDER_MAX_W) { fx = 0; fy += rowH + GAP_Y; rowH = 0; }
        rel.set(fid, { x: fx, y: fy });
        fx += L.w + GAP_X;
        maxW = Math.max(maxW, fx - GAP_X);
        rowH = Math.max(rowH, L.h);
      }
      plan.set(fo.id, { w: Math.max(120, maxW), h: Math.max(80, fy + rowH), rel, ox: 0, oy: 0 });
    }

    // ② 模块内：文件夹列装箱（多列，列高均衡；自动选让模块最接近 1.5 宽高比的列数）
    const plans = [];
    for (const g of sortedGroups) {
      if (collapsedGroups.has(g.id)) {
        plans.push({ g, folders: [], w: 260, h: M_TITLE + 6, collapsed: true });
        continue;
      }
      const folders = D.folders.filter((f) => f.group === g.id);
      const items = folders.map((fo) => {
        const p = plan.get(fo.id);
        return { fo, name: fo.name || g.name, w: p.w + 2 * F_PAD, h: p.h + 2 * F_PAD + F_TITLE };
      });
      let best = null;
      for (let n = 1; n <= Math.min(4, Math.max(1, items.length)); n++) {
        const packed = packColumns(items, 14, n);
        const w = packed.w + 2 * M_PAD, h = packed.h + M_TITLE + 2 * M_PAD;
        const ratio = w / Math.max(1, h);
        const score = Math.abs(Math.log(ratio / 1.5));
        if (!best || score < best.score) best = { packed, w, h, score, n };
      }
      const packed = best.packed;
      // 落相对坐标
      let cx = 0;
      for (const c of packed.cols) {
        let cy = 0;
        for (const it of c.items) {
          const p = plan.get(it.fo.id);
          p.ox = cx; p.oy = cy;
          cy += it.h + 14;
        }
        cx += c.w + 14;
      }
      plans.push({ g, folders, w: Math.max(380, best.w), h: Math.max(140, best.h) });
    }

    // ③ 落绝对坐标：模块列装箱；app（入口，plans 末位）独立最右列且底对齐 = 放最下面
    const appPlan = plans.find((p) => p.g.id === 'app') ?? null; // 入口模块固定最右列、底对齐
    const restPlans = appPlan ? plans.filter((p) => p !== appPlan) : plans;
    let bestAll = null;
    for (let n = 1; n <= Math.max(1, Math.min(6, restPlans.length)); n++) {
      const packed = packColumns(restPlans.map((p, pi) => ({ p, name: p.g.name, w: p.w, h: p.h, rank: pi })), 60, n);
      const cols = appPlan
        ? packed.cols.concat([{ items: [{ p: appPlan, name: appPlan.g.name, w: appPlan.w, h: appPlan.h, rank: restPlans.length }], w: appPlan.w, h: appPlan.h }])
        : packed.cols;
      const wAll = cols.reduce((sum, c) => sum + c.w, 0) + (cols.length - 1) * 60;
      const hAll = Math.max(1, ...cols.map((c) => c.h));
      const ratio = wAll / hAll;
      const score = Math.abs(Math.log(ratio / 1.55));
      if (!bestAll || score < bestAll.score) bestAll = { cols, score };
    }
    const modPos = new Map();
    let apiBox = null; // api 业务域外框（包住所有 api 子模块）
    {
      let cx = 40; let prevBottom = 0;
      bestAll.cols.forEach((c, ci) => {
        let cy = 40; let colHasApi = false;
        for (const it of c.items) {
          const gid = it.p.g.id;
          const isApi = isApiGroup(gid);
          if (isApi) colHasApi = true;
          const ey = isApi ? G_TOP : 0; // api 子模块在框内下移，给外框标题让位
          modPos.set(gid, { x: cx + (isApi ? G_PAD : 0), y: cy + ey });
          cy += it.h + ey + 60;
        }
        const colBottom = cy - 60 + (colHasApi ? G_PAD : 0); // api 列含外框底边距
        if (appPlan && ci === bestAll.cols.length - 1 && c.items.length === 1 && c.items[0].p.g.id === 'app') {
          // app 独占末列：底边与前面所有列的内容底边对齐（api 列算到外框底边）
          modPos.get(appPlan.g.id).y = Math.max(40, prevBottom - appPlan.h);
        } else {
          prevBottom = Math.max(prevBottom, colBottom);
        }
        cx += c.w + (colHasApi ? G_PAD : 0) + 60;
      });
      const apiPlans = plans.filter((pl) => isApiGroup(pl.g.id));
      if (apiPlans.length) {
        let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
        for (const pl of apiPlans) {
          const p = modPos.get(pl.g.id);
          x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
          x2 = Math.max(x2, p.x + pl.w); y2 = Math.max(y2, p.y + pl.h);
        }
        apiBox = { x: x1 - G_PAD, y: y1 - G_TOP, w: x2 - x1 + 2 * G_PAD, h: y2 - y1 + G_TOP + G_PAD };
      }
    }
    if (apiBox) {
      const apiHue = (sortedGroups.find((g) => g.id === 'api') || {}).hue ?? 210;
      const anyOpen = sortedGroups.some((g) => isApiGroup(g.id) && !collapsedGroups.has(g.id));
      const nSub = sortedGroups.filter((g) => isApiGroup(g.id)).length;
      const gEl = document.createElement('div');
      gEl.className = 'cont gcont';
      gEl.style.cssText = `left:${apiBox.x}px;top:${apiBox.y}px;width:${apiBox.w}px;height:${apiBox.h}px;--hue:${apiHue}`;
      gEl.innerHTML = `<div class="ctitle" title="点击折叠 / 展开全部 api 子模块"><span class="foldarrow">${anyOpen ? '▾' : '▸'}</span><span class="cname">api · 业务域</span><span class="cmeta">${nSub} 个子模块 · 点击标题${anyOpen ? '全部折叠' : '全部展开'}</span></div>`;
      gEl.querySelector('.ctitle').addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (suppressClick) return;           // 刚才是拖动，不是点击
        toggleApiSuperBox();
      });
      apiBoxEl = gEl;
      fragC.insertBefore(gEl, fragC.firstChild);
    }

    for (const pl of plans) {
      const pos = modPos.get(pl.g.id) || { x: 40, y: 40 };
      const mx = pos.x, my = pos.y;
      const g = pl.g, hue = g.hue;

      const mEl = document.createElement('div');
      mEl.className = 'cont mcont' + (pl.collapsed ? ' collapsed' : '');
      mEl.style.cssText = `left:${mx}px;top:${my}px;width:${pl.w}px;height:${pl.h}px;--hue:${hue}`;
      const mMeta = pl.collapsed ? `已折叠 · ${g.files.length} 文件 · 点击展开` : `${pl.folders.length} 文件夹 · ${g.files.length} 文件 · 点击标题折叠`;
      mEl.innerHTML = `<div class="ctitle" title="点击折叠 / 展开该模块"><span class="foldarrow">${pl.collapsed ? '▸' : '▾'}</span><span class="cname">${escapeHtml(g.name)}</span><span class="cmeta">${mMeta}</span></div>`;
      mEl.dataset.group = g.id;
      mEl.querySelector('.ctitle').addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (suppressClick) return;           // 刚才是拖动，不是点击
        toggleModuleCollapse(g.id);
      });
      fragC.appendChild(mEl);
      moduleBounds.set(g.id, { x: mx, y: my, w: pl.w, h: pl.h, el: mEl, files: g.files, shown: undefined });

      for (const fo of pl.folders) {
        const p = plan.get(fo.id);
        const fX = mx + M_PAD + p.ox, fY = my + M_TITLE + M_PAD + p.oy;
        const fW = p.w + 2 * F_PAD, fH = p.h + 2 * F_PAD + F_TITLE;
        const fEl = document.createElement('div');
        fEl.className = 'cont fcont';
        fEl.style.cssText = `left:${fX}px;top:${fY}px;width:${fW}px;height:${fH}px;--hue:${hue}`;
        fEl.innerHTML = `<div class="ctitle"><span class="cname">🗀 ${escapeHtml(fo.name || g.name)}</span><span class="cmeta">${fo.files.length} 文件</span></div>`;
        fEl.dataset.folder = fo.id;
        fragC.appendChild(fEl);
        folderBounds.set(fo.id, { x: fX, y: fY, w: fW, h: fH, group: g.id, files: fo.files, el: fEl, shown: undefined });

        for (const fid of fo.files) {
          const r = p.rel.get(fid);
          const file = fileById.get(fid);
          const L = fileLayout(fid);
          const isFolded = foldedFiles.has(fid);
          const b = { fileId: fid, x: fX + F_PAD + r.x, y: fY + F_TITLE + F_PAD + r.y, w: L.w,
            h: isFolded ? HEAD_H : L.h, h0: L.h, collapsed: isFolded,
            fnIds: file.fns.slice(), varIds: (file.vars || []).slice(), el: null, headEl: null, hintEl: null, group: g.id, folder: fo.id, shown: undefined };
          const el = document.createElement('div');
          el.className = 'box' + (isFolded ? ' is-collapsed' : '');
          el.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;border-color:hsl(${hue},35%,80%)`;
          const head = document.createElement('div');
          head.className = 'box-head';
          head.style.background = `hsl(${hue},50%,95%)`;
          const vn = (file.vars || []).length;
          head.innerHTML = `<span class="fold" title="折叠 / 展开该文件">${isFolded ? '+' : '–'}</span><span class="fname" style="color:hsl(${hue},40%,30%)" title="${escapeHtml(file.path)} · 点击标题折叠/展开">${escapeHtml(file.name)}</span><span class="fmeta">${file.fns.length}f${vn ? '·' + vn + 'v' : ''}·${file.lines}L</span>`;
          el.appendChild(head);
          fragB.appendChild(el);
          b.el = el; b.headEl = head;
          el.dataset.file = fid;
          boxPos.set(fid, b);

          if (L.empty) {
            const hint = document.createElement('div');
            hint.className = 'empty-hint';
            hint.textContent = '仅内联回调，无可展示函数';
            hint.style.cssText = `left:${b.x + 10}px;top:${b.y + HEAD_H + 5}px;`;
            if (isFolded) hint.style.display = 'none';
            b.hintEl = hint;
            fragN.appendChild(hint);
          }
          // 网格排布：按列放置
          for (let ci = 0; ci < L.cols.length; ci++) {
            let ny = b.y + HEAD_H + 6;
            for (const nid of L.cols[ci]) {
              // 列镜像：拓扑靠前（调用方）在右，被调方在左，连线条左向流动
              const nx = b.x + PAD_X + (L.cols.length - 1 - ci) * (NODE_W + COL_GAP);
              if (nid.startsWith('var:')) {
                const v = varById.get(nid);
                const node = document.createElement('div');
                node.className = 'fn-node vnode' + (v.storage ? ' v-storage' : '');
                node.style.cssText = `left:${nx}px;top:${ny}px;width:${NODE_W}px;height:${VAR_H - 2}px`;
                node.innerHTML = `<i class="pdot in"></i><span class="vi">${v.storage ? '▤' : '▫'}</span><span title="${escapeHtml(v.name)}">${escapeHtml(v.name)}</span><span class="vtype">${v.type}</span><span class="ln">${v.line != null ? 'L' + v.line : (v.readers != null ? v.readers + ' 处' : '')}</span><i class="pdot out"></i>`;
                node.dataset.fn = nid;
                fragN.appendChild(node);
                fnPos.set(nid, { x: nx, y: ny, w: NODE_W, h: VAR_H - 2, el: node, home: fid, shown: undefined, portsDone: true });
                for (const e of inL.get(nid) || []) e.ptRel = (VAR_H - 2) / 2;
                for (const e of outL.get(nid) || []) e.pfRel = (VAR_H - 2) / 2;
              } else {
                const fn = fnById.get(nid);
                const nh = fnNodeH(nid);
                const ins = inL.get(nid) || [], outs = outL.get(nid) || [];
                const node = document.createElement('div');
                node.className = 'fn-node card' + (fn.kind === 'class' ? ' k-class-node' : '');
                node.style.cssText = `left:${nx}px;top:${ny}px;width:${NODE_W}px;height:${nh}px;--hue:${hue};border-color:hsl(${hue},25%,88%);border-left-color:hsl(${hue},58%,58%)`;
                const kindCls = fn.kind === 'arrow' ? 'k-arrow' : fn.kind === 'method' ? 'k-method'
                  : fn.kind === 'class' ? 'k-class' : fn.kind.startsWith('async') ? 'k-async' : 'k-function';
                let pr = '';
                // 左列 = 入口（我调用了谁）—— 出边一律从这里离开，永不改到右侧
                outs.slice(0, MAXP).forEach((e, i) => {
                  e.pfRel = NODE_HEAD + i * PORT_H + PORT_H / 2;
                  pr += `<div class="port pin" style="top:${i * PORT_H}px"><i class="on"></i><span>${escapeHtml(labelOfNode(e.t))}</span></div>`;
                });
                if (outs.length > MAXP) {
                  outs.slice(MAXP).forEach((e) => { e.pfRel = NODE_HEAD + MAXP * PORT_H + PORT_H / 2; });
                  pr += `<div class="port pin more" style="top:${MAXP * PORT_H}px"><i></i><span>+${outs.length - MAXP} 个入口</span></div>`;
                }
                // 右列 = 出口（谁调用了我）—— 入边一律从这里进入
                ins.slice(0, MAXP).forEach((e, i) => {
                  e.ptRel = NODE_HEAD + i * PORT_H + PORT_H / 2;
                  pr += `<div class="port pout" style="top:${i * PORT_H}px"><span>${escapeHtml(labelOfNode(e.f))}</span><i class="on"></i></div>`;
                });
                if (ins.length > MAXP) {
                  ins.slice(MAXP).forEach((e) => { e.ptRel = NODE_HEAD + MAXP * PORT_H + PORT_H / 2; });
                  pr += `<div class="port pout more" style="top:${MAXP * PORT_H}px"><span>+${ins.length - MAXP} 个出口</span><i></i></div>`;
                }
                if (!ins.length && !outs.length) pr = '<div class="port pin" style="top:0"><i></i><span class="ph">未连接</span></div>';
                node.innerHTML = `<div class="nh"><span class="k ${kindCls}"></span><span class="nn" title="${escapeHtml(fn.name)}">${escapeHtml(fn.name)}</span>${fn.exported ? '<span class="exp">●</span>' : ''}${fn.kind === 'class' && fn.methods?.length ? `<span class="nl km">${fn.methods.length} 方法</span>` : ''}<span class="nl">L${fn.line}</span></div><div class="nb"></div>`;
                node._ports = pr;
                node.dataset.fn = nid;
                fragN.appendChild(node);
                fnPos.set(nid, { x: nx, y: ny, w: NODE_W, h: nh, el: node, home: fid, shown: undefined, portsDone: false });
              }
              ny += L.hOf(nid);
            }
          }
        }
      }
    }

    contEl.appendChild(fragC);
    boxesEl.appendChild(fragB);
    nodesEl.appendChild(fragN);
    applySavedOffsets();   // 恢复上次拖动保存的位置
    syncContainers();      // 文件夹包围盒按最终位置重算（单独拖过文件框时会跟着长大）
    refreshApiBox();       // 外框按最终模块位置包住
    if (litKeys.size) for (const e of edges) { if (litKeys.has(e.f + '>' + e.t)) e.lit = true; }
    bootRepaintLit();      // 演示进行中被折叠/展开时，补回已点亮的节点
    drawEdges();
  }

  // api 业务域外框：一键折叠/展开全部 api 子模块
  function toggleApiSuperBox() {
    const apiIds = D.groups.map((g) => g.id).filter(isApiGroup);
    const anyOpen = apiIds.some((id) => !collapsedGroups.has(id));
    for (const id of apiIds) { if (anyOpen) collapsedGroups.add(id); else collapsedGroups.delete(id); }
    build();
    applyVisibility();
    syncContainers();
    scheduleCull();
  }

  // 模块折叠/展开：重建布局（被折叠模块只留标题条，其余模块重新装箱）
  function toggleModuleCollapse(gid) {
    if (collapsedGroups.has(gid)) collapsedGroups.delete(gid); else collapsedGroups.add(gid);
    build();
    applyVisibility();
    syncContainers();
    scheduleCull();
  }

  // 空闲预热：把端口行分批注入 DOM，避免首次平移/缩放时集中渲染导致卡顿
  function warmPorts() {
    const list = [];
    for (const pr of fnPos.values()) if (!pr.portsDone) list.push(pr);
    if (!list.length) return;
    let i = 0;
    const idle = window.requestIdleCallback || ((fn) => setTimeout(() => fn({ timeRemaining: () => 8 }), 120));
    const step = () => {
      const t0 = performance.now();
      while (i < list.length && performance.now() - t0 < 6) {
        const pr = list[i++];
        const nb = pr.el.querySelector('.nb');
        if (nb && pr.el._ports && !nb.innerHTML) nb.innerHTML = pr.el._ports;
        pr.portsDone = true;
      }
      if (i < list.length) idle(step, { timeout: 600 });
    };
    idle(step, { timeout: 600 });
  }

        `<div class="fid">${escapeHtml(v.id)}</div>`;
    } else {
      const fn = fnById.get(id);
      const inList = idxs.filter((i) => edges[i].t === id).map((i) => ({ id: edges[i].f, k: edges[i].k, ln: edges[i].l }));
      const outList = idxs.filter((i) => edges[i].f === id).map((i) => ({ id: edges[i].t, k: edges[i].k, ln: edges[i].l }));
      const file = fileById.get(fn.file);
      const total = fn.endLine - fn.line + 1;
      currentSrc = fn.src ?? '';
      html = `<h4>λ ${escapeHtml(fn.name)}${fn.exported ? '<span class="badge">export</span>' : ''}</h4>` +
        `<div class="row">文件: <b>${escapeHtml(file.name)}</b> · L${fn.line}–${fn.endLine}</div>` +
        `<div class="row">类型: <b>${escapeHtml(KIND_NAME[fn.kind] ?? fn.kind)}</b>${fn.params?.length ? ` · 入参: <b>(${escapeHtml(fn.params.join(', '))})</b>` : ''}</div>` +
        (fn.kind === 'class' && fn.methods?.length
          ? `<div class="row">方法: <b>${escapeHtml(fn.methods.slice(0, 14).join(', '))}</b>${fn.methods.length > 14 ? ` …共 ${fn.methods.length} 个` : ''}</div>`
          : '') +
        (fn.doc ? `<div class="row">说明: ${escapeHtml(fn.doc)}</div>` : '') +
        `<div class="src-head"><span>📥 入口 · 我调用了谁（${outList.length}）<i class="side">← 左侧</i></span></div>${ioListHtml(outList, 'out')}` +
        `<div class="src-head"><span>📤 出口 · 谁调用了它（${inList.length}）<i class="side">右侧 →</i></span></div>${ioListHtml(inList, 'in')}` +
        `<div class="src-head"><span>源码（${total} 行）</span><span class="btns"><button data-act="copy">复制</button><button data-act="expand">展开</button></span></div>` +
        `<pre class="code">${hlCode(currentSrc)}</pre>` +
        (fn.truncated ? `<div class="trunc">⚠ 源码过长已截断（完整 ${total} 行，见源文件 ${escapeHtml(file.path)}）</div>` : '') +
        `<div class="fid">${escapeHtml(fn.id)}</div>`;
    }
    $('#detailBody').innerHTML = html;
    detail.style.display = 'block';
  }
  function clearSel() {
    world.classList.remove('dim');
    chainChip.style.display = 'none';
    document.querySelectorAll('.lit').forEach((el) => el.classList.remove('lit'));
    for (const e of edges) e.lit = false;
    detail.style.display = 'none';
    drawEdges();
  }
  // ==========================================================
  // 演示（跑马灯）：沿真实调用边一步步点亮「路上经过的函数」，
  // 右侧半透明面板同步列出运行列表；支持选链路、上一步/下一步、点行跳到某一步。
  //   boot    后端启动：createApp → 11 个 loader → 各自依赖
  //   request 一次请求：任一 api handler → 校验 → 会话 → 审计 → 存储
  // ==========================================================
  const traceCanvas = $('#trace');
  const tctx = traceCanvas.getContext('2d');
  const tourPanel = $('#tourPanel');
  const btnBoot = $('#btnBoot');
  const btnRequest = $('#btnRequest');
  const SPEEDS = [1000, 600, 320];                  // 慢 / 正常 / 快（毫秒/步）
  const SPEED_NAME = ['慢速', '正常', '快速'];
  const KIND_ORDER = { boot: 0, import: 1, local: 2, ref: 3, guess: 4 };
  let boot = null;              // 当前演示会话
  let lastReqStart = null;      // 上次选过的请求链路起点

  function findFn(name, fileRe) {
    const all = [...fnById.values()];
    return (all.find((f) => f.name === name && (!fileRe || fileRe.test(f.file))) ?? all.find((f) => f.name === name))?.id ?? null;
  }

  const TOUR_MODES = {
    boot: {
      icon: '🚀', title: '启动流程',
      start: () => findFn('createApp', /^app\.js$/),
      subtitle: () => 'createApp 装配 → registry 11 个 loader → 各自依赖',
      limit: 260, maxDepth: 0,
      kinds: ['boot', 'import', 'local', 'ref', 'guess'],
      zoom: 0.45,
    },
    request: {
      icon: '🌐', title: '请求链路',
      start: () => lastReqStart ?? findFn('login', /oauth21\/v1\/auth\/login\.js$/),
      subtitle: (n) => `一次请求进入 ${n} 之后依次调用的函数 · 层序展开（最多 5 层）`,
      // 只走"真实调用"三类，跳过 guess（跨文件同名推断噪音大，会把链路带偏）
      limit: 70, maxDepth: 5,
      kinds: ['import', 'local', 'ref'],
      zoom: 0.55,
    },
  };

  function sizeTrace() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = viewport.clientWidth, h = viewport.clientHeight;
    traceCanvas.width = Math.round(w * dpr); traceCanvas.height = Math.round(h * dpr);
    traceCanvas.style.width = w + 'px'; traceCanvas.style.height = h + 'px';
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 子节点：先按边类型（真实调用 > 推断），同级按文件+行号，读起来像执行顺序
  function tourChildren(id, kinds) {
    const allow = new Set(kinds);
    const list = [];
    for (const i of nodeEdges.get(id) ?? []) {
      const e = edges[i];
      if (e.f !== id || !allow.has(e.k)) continue;
      const tgt = fnById.get(e.t);
      if (!tgt) continue;                     // file: / var: 目标不参与
      list.push({ i, tgt, o: KIND_ORDER[e.k] });
    }
    list.sort((a, b) => a.o - b.o
      || `${a.tgt.file}#${String(a.tgt.line).padStart(6, '0')}`.localeCompare(`${b.tgt.file}#${String(b.tgt.line).padStart(6, '0')}`));
    return list;
  }

  // 层序展开（BFS）：启动是"一层层装配"，请求是"一层层下沉"，都比 DFS 更像真实时序
  function buildTourSteps(mode, startId) {
    const conf = TOUR_MODES[mode];
    const start = startId ?? conf.start();
    if (!start) return { conf, start: null, steps: [] };
    const seen = new Set([start]);
    const steps = [];
    const queue = [{ id: start, depth: 0 }];
    while (queue.length && steps.length < conf.limit) {
      const { id, depth } = queue.shift();
      if (conf.maxDepth && depth >= conf.maxDepth) continue;
      for (const c of tourChildren(id, conf.kinds)) {
        if (steps.length >= conf.limit) break;
        if (seen.has(c.tgt.id)) continue;     // 已点过的不重复跑，画面是一棵"生长"的树
        seen.add(c.tgt.id);
        steps.push({ from: id, to: c.tgt.id, ei: c.i, depth: depth + 1 });
        queue.push({ id: c.tgt.id, depth: depth + 1 });
      }
    }
    return { conf, start, steps };
  }

  // 请求链路的候选：api 域里出边 >=2 的处理函数，按 BFS 规模排序（链路最长的排前面）
  let reqCandCache = null;
  function requestCandidates() {
    if (reqCandCache) return reqCandCache;
    // 候选 = api 域里每个文件出边最多的函数（排除 register*/配置同步这类非请求入口）。
    // 不能按"出边多"预筛再算：像 login 这种只调一个下游、但链路很深的会被漏掉，
    // 所以直接对所有文件代表算一次 BFS 规模（结果缓存，只在首次打开面板时算）。
    const pool = [...fnById.values()].filter((f) =>
      f.file.startsWith('api/') && !/^register/i.test(f.name) && f.kind !== 'class'
      && !/^(load|sync|merge|start|stop)[A-Z]/.test(f.name));
    const byFile = new Map();
    for (const f of pool) {
      const deg = (nodeEdges.get(f.id) ?? []).filter((i) => edges[i].f === f.id).length;
      const prev = byFile.get(f.file);
      if (!prev || deg > prev.deg) byFile.set(f.file, { f, deg });
    }
    reqCandCache = [...byFile.values()]
      .map((x) => ({ ...x, size: buildTourSteps('request', x.f.id).steps.length }))
      .filter((x) => x.size >= 6)                    // 太短的链路没有演示价值
      .sort((a, b) => b.size - a.size || a.f.name.localeCompare(b.f.name))
      .slice(0, 10);
    return reqCandCache;
  }

  // 贝塞尔 / 折线上的取点（k ∈ [0,1] 按弧长）
  function pathPoint(g, k) {
    if (g.bez) {
      const u = 1 - k, p1x = g.bez.c1x, p2x = g.bez.c2x;
      return {
        x: u * u * u * g.sx1 + 3 * u * u * k * p1x + 3 * u * k * k * p2x + k * k * k * g.sx2,
        y: u * u * u * g.sy1 + 3 * u * u * k * g.sy1 + 3 * u * k * k * g.sy2 + k * k * k * g.sy2,
      };
    }
    const pts = g.pts, segs = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      segs.push(d); total += d;
    }
    if (!total) return { x: pts[0][0], y: pts[0][1] };
    let want = k * total;
    for (let i = 0; i < segs.length; i++) {
      if (want <= segs[i] || i === segs.length - 1) {
        const t = segs[i] ? Math.min(1, want / segs[i]) : 0;
        return { x: pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, y: pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t };
      }
      want -= segs[i];
    }
    return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
  }

  // ---------- 右侧面板 ----------
  function tourHead() {
    if (!boot) return;
    const i = Math.min(boot.i, boot.steps.length);
    tourPanel.querySelector('.tp-ico').textContent = boot.conf.icon;
    tourPanel.querySelector('.tp-title').textContent = boot.conf.title;
    tourPanel.querySelector('.tp-count').textContent = `${i}/${boot.steps.length}`;
    tourPanel.querySelector('.tp-sub').textContent = boot.subText;
    tourPanel.querySelector('.tp-bar i').style.width = Math.round((i / Math.max(1, boot.steps.length)) * 100) + '%';
    const pb = tourPanel.querySelector('[data-act="pause"]');
    pb.textContent = boot.paused ? '继续' : '暂停';
    pb.style.visibility = boot.done ? 'hidden' : '';
    tourPanel.querySelector('[data-act="speed"]').style.visibility = boot.done ? 'hidden' : '';
  }

  function tourRow(n, id, depth, isCur, step) {
    const list = tourPanel.querySelector('.tp-list');
    if (isCur) {
      const prev = list.querySelector('.tp-row.cur');
      if (prev) prev.classList.remove('cur');
    }
    const row = document.createElement('div');
    row.className = 'tp-row' + (isCur ? ' cur' : '');
    row.dataset.fn = id;
    row.dataset.step = String(step);
    row.innerHTML = `<span class="n">${n}</span><span class="f" title="${escapeHtml(id)}">${escapeHtml(labelOfNode(id))}</span>` +
      `<span class="d">${depth ? 'L' + depth : ''}</span>`;
    list.appendChild(row);
    if (isCur) list.scrollTop = list.scrollHeight;
  }

  function rebuildRows() {
    const list = tourPanel.querySelector('.tp-list');
    list.innerHTML = '';
    tourRow('起', boot.start, 0, boot.i === 0, 0);
    for (let k = 0; k < boot.i; k++) {
      const st = boot.steps[k];
      tourRow(k + 1, st.to, st.depth, k === boot.i - 1, k + 1);
    }
    list.scrollTop = list.scrollHeight;
  }

  // 目标跑出视口才平移相机（避免每步都动、观感抖）。
  // 这里不走 applyView：它内部做同步全量裁剪（2393 节点），每步一次太贵；改用去抖裁剪。
  function tourFollow(id) {
    const p = fnPos.get(id);
    if (!p) return;
    const cx = (p.x + p.w / 2) * vs + vx, cy = (p.y + p.h / 2) * vs + vy;
    const W = viewport.clientWidth, H = viewport.clientHeight;
    if (cx > 90 && cx < W - 90 && cy > 90 && cy < H - 90) return;
    vx = W / 2 - (p.x + p.w / 2) * vs;
    vy = H / 2 - (p.y + p.h / 2) * vs;
    edgeTf = null;
    if (canvas.style.transform) canvas.style.transform = '';
    world.style.transform = `translate(${vx}px,${vy}px) scale(${vs})`;
    drawEdges();
    scheduleCull();
  }

  // 光点动画：每帧只画一个光点 + 6 个拖尾，不动主画布（4652 条边重绘约 24ms/次，当每帧开销不可用）
  function tourFrame() {
    if (!boot) return;
    tctx.clearRect(0, 0, viewport.clientWidth, viewport.clientHeight);
    const cur = boot.cur;
    if (cur && !boot.paused) {
      const e = edges[cur.ei];
      const g = e ? edgePath(e) : null;
      if (g) {
        const dur = Math.max(150, boot.speed * 0.8);
        const k = Math.min(1, (performance.now() - boot.phase) / dur);
        for (let n = 6; n >= 1; n--) {
          const q = pathPoint(g, Math.max(0, k - n * 0.035));
          tctx.beginPath();
          tctx.arc(q.x, q.y, Math.max(0.8, 5.4 - n * 0.62), 0, Math.PI * 2);
          tctx.fillStyle = `rgba(221,117,51,${(0.30 - n * 0.036).toFixed(3)})`;
          tctx.fill();
        }
        const head = pathPoint(g, k);
        tctx.beginPath(); tctx.arc(head.x, head.y, 6.2, 0, Math.PI * 2);
        tctx.fillStyle = `rgba(221,117,51,${(0.28 + k * 0.5).toFixed(3)})`; tctx.fill();
        tctx.beginPath(); tctx.arc(head.x, head.y, 3, 0, Math.PI * 2);
        tctx.fillStyle = '#fff8f0'; tctx.fill();
      }
    }
    boot.raf = requestAnimationFrame(tourFrame);
  }

  function lightStep(st) {
    edges[st.ei].lit = true;
    const p = fnPos.get(st.to);
    if (p) {
      p.el.classList.add('lit');
      const b = boxPos.get(p.home);
      if (b) b.el.classList.add('lit');
    }
  }

  function markWalking(id) {
    document.querySelectorAll('.fn-node.walking').forEach((el) => el.classList.remove('walking'));
    const p = id ? fnPos.get(id) : null;
    if (p) p.el.classList.add('walking');
  }

  // 增量前进一步（自动播放与「下一步」都用它）
  function tourAdvance() {
    if (!boot || boot.i >= boot.steps.length) return false;
    const st = boot.steps[boot.i++];
    lightStep(st);
    markWalking(st.to);
    boot.cur = { from: st.from, to: st.to, ei: st.ei };
    boot.phase = performance.now();
    tourFollow(st.to);
    drawEdges();
    tourRow(boot.i, st.to, st.depth, true, boot.i);
    tourHead();
    return true;
  }

  // 重算到第 n 步（上一步 / 跳到某一步）：清空点亮后按 steps[0..n-1] 重放，再重建列表
  function tourRenderTo(n) {
    if (!boot) return;
    n = Math.max(0, Math.min(n, boot.steps.length));
    boot.i = n;
    document.querySelectorAll('.lit').forEach((el) => el.classList.remove('lit'));
    for (const e of edges) e.lit = false;
    const sp = fnPos.get(boot.start);
    if (sp) { sp.el.classList.add('lit'); boxPos.get(sp.home)?.el.classList.add('lit'); }
    for (let k = 0; k < n; k++) lightStep(boot.steps[k]);
    const last = n > 0 ? boot.steps[n - 1] : null;
    boot.cur = last ? { from: last.from, to: last.to, ei: last.ei } : null;
    boot.phase = performance.now();
    markWalking(last?.to ?? null);
    rebuildRows();
    tourHead();
    drawEdges();
    if (last) tourFollow(last.to);
    if (n >= boot.steps.length) tourFinish();
    else if (boot.done) { boot.done = false; boot.paused = true; }
  }

  function tourStep() {
    if (!boot || boot.paused || boot.done) return;
    if (!tourAdvance()) { tourFinish(); return; }
    boot.timer = setTimeout(tourStep, boot.speed);
  }

  function tourFinish() {
    if (!boot || boot.done) return;
    clearTimeout(boot.timer);
    boot.paused = true; boot.done = true; boot.cur = null;
    markWalking(null);
    const list = tourPanel.querySelector('.tp-list');
    if (!list.querySelector('.tp-done')) {
      const tip = document.createElement('div');
      tip.className = 'tp-done';
      tip.textContent = `✅ 走完 ${boot.steps.length} 步 · 点任意一行可跳回那一步`;
      list.appendChild(tip);
    }
    list.scrollTop = list.scrollHeight;
    tourHead();
    btnBoot.textContent = '▶ 启动';
    btnRequest.textContent = '▶ 请求';
    btnBoot.classList.remove('playing');
    btnRequest.classList.remove('playing');
    drawEdges();
  }

  // 手动步进：先暂停自动播放，再按方向走
  function tourManual(dir) {
    if (!boot || tourPanel.classList.contains('picking')) return;
    boot.paused = true;
    clearTimeout(boot.timer);
    if (boot.done && dir > 0) return;
    if (dir > 0) { if (tourAdvance()) { /* 已在末尾则不动 */ } }
    else tourRenderTo(boot.i - 1);
    if (boot.done && boot.i < boot.steps.length) boot.done = false;
    tourHead();
  }

  function tourGoTo(n) {
    if (!boot) return;
    boot.paused = true;
    clearTimeout(boot.timer);
    tourRenderTo(n);
  }

  function showPicker() {
    if (boot) tourStop();
    tourPanel.classList.add('on', 'picking');
    tourPanel.querySelector('.tp-ico').textContent = '🌐';
    tourPanel.querySelector('.tp-title').textContent = '选择请求链路';
    tourPanel.querySelector('.tp-count').textContent = '';
    tourPanel.querySelector('.tp-sub').textContent = '点一条开始演示 · 按链路规模排序';
    tourPanel.querySelector('.tp-bar i').style.width = '0%';
    const box = tourPanel.querySelector('.tp-pick');
    box.innerHTML = '<div class="pk-head">候选处理函数（数字为预计步数）</div>';
    for (const [k, c] of requestCandidates().entries()) {
      const row = document.createElement('div');
      row.className = 'tp-row pick';
      row.dataset.start = c.f.id;
      row.innerHTML = `<span class="n">${k + 1}</span>` +
        `<span class="f" title="${escapeHtml(c.f.file + ' · L' + c.f.line)}">${escapeHtml(c.f.name)}</span>` +
        `<span class="d">${c.size}步</span>`;
      box.appendChild(row);
    }
    if (!box.querySelector('.tp-row')) box.innerHTML += '<div class="pk-head">没找到候选（api 域没有可展开的调用链）</div>';
  }

  function tourStart(mode, startId) {
    const sameBtn = !!boot && boot.mode === mode && !startId;
    if (boot) tourStop();
    if (sameBtn) return;                       // 同一按钮再点 = 停止
    const { conf, start, steps } = buildTourSteps(mode, startId);
    if (!start || !steps.length) return;
    if (mode === 'boot' && !filters.boot) {
      filters.boot = true;
      document.querySelector('#filterSeg button[data-k="boot"]')?.classList.add('on');
    }
    clearSel();
    clearTimeout(settleTimer); edgeTf = null; canvas.style.transform = '';
    // 全览（7%~13%）下光点只有两三个像素，看不出跑马灯；至少放大到该模式的起始缩放并居中起点
    if (vs < conf.zoom) {
      vs = conf.zoom;
      const p0 = fnPos.get(start);
      vx = viewport.clientWidth / 2 - ((p0?.x ?? 0) + (p0?.w ?? 0) / 2) * vs;
      vy = viewport.clientHeight / 2 - ((p0?.y ?? 0) + (p0?.h ?? 0) / 2) * vs;
    }
    world.classList.add('dim');   // 未点亮的一律压暗：只有电流经过的地方亮
    applyView();
    const sp = fnPos.get(start);
    if (sp) { sp.el.classList.add('lit'); const b = boxPos.get(sp.home); if (b) b.el.classList.add('lit'); }

    boot = {
      mode, conf, start, steps, i: 0, speed: SPEEDS[1], speedIdx: 1,
      paused: false, done: false, cur: null, timer: 0, raf: 0, phase: 0,
      subText: conf.subtitle(labelOfNode(start)),
    };
    tourPanel.classList.add('on');
    tourPanel.classList.remove('picking');
    tourPanel.querySelector('.tp-list').innerHTML = '';
    tourPanel.querySelector('[data-act="speed"]').textContent = SPEED_NAME[1];
    tourRow('起', start, 0, true, 0);
    btnBoot.textContent = '▶ 启动';
    btnRequest.textContent = '▶ 请求';
    const active = mode === 'boot' ? btnBoot : btnRequest;
    active.classList.add('playing');
    active.textContent = '■ 停止';
    tourHead();
    sizeTrace();
    tourFrame();
    tourStep();
  }

  function tourStop() {
    if (!boot) return;
    clearTimeout(boot.timer);
    cancelAnimationFrame(boot.raf);
    boot = null;
    tctx.clearRect(0, 0, viewport.clientWidth, viewport.clientHeight);
    tourPanel.classList.remove('on', 'picking');
    btnBoot.classList.remove('playing');
    btnRequest.classList.remove('playing');
    btnBoot.textContent = '▶ 启动';
    btnRequest.textContent = '▶ 请求';
    document.querySelectorAll('.fn-node.walking').forEach((el) => el.classList.remove('walking'));
    world.classList.remove('dim');
    document.querySelectorAll('.lit').forEach((el) => el.classList.remove('lit'));
    for (const e of edges) e.lit = false;
    drawEdges();
  }

  // 模块折叠/展开会重建整层 DOM（class 全丢，但 edges[i].lit 还在）→ 重建后补回点亮态
  function bootRepaintLit() {
    if (!boot) return;
    for (const e of edges) {
      if (!e.lit) continue;

      if (act === 'next') { tourManual(1); return; }
      if (act === 'pause') {
        if (boot.done) return;

  // ---------- 文件详情卡 ----------
  const fmodal = $('#fmodal'), fcard = $('#fcard');
  const KIND_TAG = { import: ['跨文件', 't-import'], local: ['同文件', 't-local'], ref: ['引用', 't-ref'], guess: ['推断', 't-guess'], var: ['变量', 't-var'], env: ['环境变量', 't-env'], log: ['日志', 't-log'], boot: ['启动链', 't-boot'] };
  const KIND_DOT = { arrow: 'k-arrow', method: 'k-method', class: 'k-class' };
  const KIND_NAME = { class: '类（整体一个框，含全部方法）', method: '方法', arrow: '箭头函数', function: '函数', 'async function': '异步函数', 'async arrow': '异步箭头函数', 'async method': '异步方法' };
  const kindDot = (kind) => KIND_DOT[kind] ?? (kind.startsWith('async') ? 'k-async' : 'k-function');
  function endLabel(id, ln) {
    if (id.startsWith('file:')) return `<i>${ln ? '（模块顶层 L' + ln + '）' : '（文件级）'}</i>`;
    if (id.startsWith('var:')) { const v = varById.get(id); return (v?.storage ? '▤ ' : '▫ ') + escapeHtml(v?.name ?? id); }
    const fn = fnById.get(id);
    return fn ? escapeHtml(fn.name) : escapeHtml(id);
  }
  function groupByCounter(arr, isEntry) {
    const m = new Map();
    for (const e of arr) {
      const other = isEntry ? e.f : e.t;
      const key = other.startsWith('file:') ? other.slice(5) : fnById.get(other)?.file ?? other;
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(e);
    }
    return [...m.entries()].sort((a, b) => b[1].length - a[1].length);
  }
  function openFileModal(fid) {
    const file = fileById.get(fid);

      const tIn = e.t === 'file:' + fid || fnsSet.has(e.t);
      const fIn = e.f === 'file:' + fid || fnsSet.has(e.f);
      if (tIn && !fIn) entry.push(e);
      if (fIn && !tIn) exit.push(e);

      return groups.map(([otherFile, list]) => {

      const fn = fnById.get(id);

    }).join('');
    const VT = { map: 'Map', set: 'Set', object: '对象', array: '数组', instance: '实例', primitive: '常量', env: '环境变量', logger: '日志' };
    const vrows = (file.vars || []).map((vid) => {

    fcard.innerHTML = `
      <div class="fhead">

          <div class="fpath">${escapeHtml(file.path)} · <b>${file.lines}</b> 行</div>
        </div>
        <button class="fclose" title="关闭 (Esc)">×</button>

      <div class="fbody">
        ${docHtml}
        <div class="fstats">
          <span class="st">函数 <b>${file.fns.length}</b></span>
          <span class="st">导出 <b>${exportCnt}</b></span>
          <span class="st io">入口边 <b>${entry.length}</b></span>

        <div class="fsec"><b>📤 出口 <span class="cnt2">谁调用本文件（${entry.length} 条，来自 ${entryG.length} 个文件）· 线在右侧</span></b>${egroupHtml(entryG, true)}</div>

        <div class="fsec"><b>▤ 变量 / 存储明细 <span class="cnt2">${(file.vars || []).length} 个 · 点击行可跳到画布对应方框</span></b>${vrows || '<div class="fempty">本文件没有模块级变量</div>'}</div>

  // ---------- 侧栏：目录树（模块 → 文件夹 → 文件，每级可勾选） ----------
  const treeOpen = { groups: new Set(), folders: new Set() }; // 默认全部收起，按需展开（352 个文件全铺开太长）
  const treeData = (() => {

        .map((fo) => ({ id: fo.id, name: fo.name || g.name, files: fo.files.slice() }));

  let treeRows = []; // { el, input, files }

  function treeRow(o) {

  function renderTree() {

        open: gOpen, hasKids: g.folders.length > 0, cnt: `${g.files.length}📄` }));
      if (!gOpen) continue;
      for (const fo of g.folders) {

  // 勾选状态三态：全选 / 半选 / 未选

    for (const r of treeRows) {
      const total = r.files.length;

      for (const fid of r.files) if (!hiddenFiles.has(fid)) vis++;
      r.input.checked = vis > 0;
      r.input.indeterminate = vis > 0 && vis < total;
      r.el.classList.toggle('off', vis === 0);
    }
  }

      <div class="li"><span class="sw" style="background:#e8f5f3;border-color:#2fa89a"></span>存储方框（Map/对象）&nbsp;<span class="sw" style="background:#fbfaff;border-color:#cdc7e4"></span>变量</div>
      <div class="li"><span class="sw dot" style="background:#2f9e63"></span>已导出函数</div>
      <div class="li"><span class="sw dot" style="background:#6f9de0"></span>函数&nbsp;<span class="sw dot" style="background:#45b3bf"></span>箭头&nbsp;<span class="sw dot" style="background:#9b7fe0"></span>异步&nbsp;<span class="sw dot" style="background:#2f9e8f"></span>类（含方法）</div>`;
    sb.appendChild(legend);
  }

  function focusRect(r) {
    const vw = viewport.clientWidth - 60, vh = viewport.clientHeight - 60;
    vs = Math.min(vw / r.w, vh / r.h, 1);
    vx = (viewport.clientWidth - r.w * vs) / 2 - r.x * vs;
    vy = (viewport.clientHeight - r.h * vs) / 2 - r.y * vs;
    applyView();
  }
  function focusGroup(gid) { const m = moduleBounds.get(gid); if (m) focusRect(m); }
  function focusFolder(fid) { const r = folderBounds.get(fid); if (r) focusRect(r); }

  // ---------- 搜索 ----------
  const searchInput = $('#search'), results = $('#searchResults');
  let hits = [], hitIdx = -1;
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    hitIdx = -1;
    if (!q) { results.style.display = 'none'; return; }
    hits = [];
    for (const fn of D.functions) if (fn.name.toLowerCase().includes(q)) hits.push({ id: fn.id, label: fn.name, sub: fn.file });
    for (const f of D.files) if (f.name.toLowerCase().includes(q)) hits.push({ id: 'file:' + f.id, label: f.name, sub: f.path });
    for (const v of D.variables || []) if (v.name.toLowerCase().includes(q)) hits.push({ id: v.id, label: (v.storage ? '▤ ' : '▫ ') + v.name, sub: v.file + ' · ' + v.type });
    hits = hits.slice(0, 40);
    results.innerHTML = hits.map((h, i) => `<div class="item" data-i="${i}"><span>${escapeHtml(h.label)}</span><span class="file">${escapeHtml(h.sub)}</span></div>`).join('') || '<div class="item">无匹配</div>';
    results.style.display = 'block';
  });
  results.addEventListener('click', (ev) => {
    const item = ev.target.closest('.item[data-i]');
    if (item) gotoHit(+item.dataset.i);
  });
  searchInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && hits.length) gotoHit((hitIdx + 1) % hits.length);
  });
  function gotoHit(i) {
    hitIdx = i;
    const h = hits[i];
    if (!h) return;
    let wx, wy, el;
    const hf = fileOfEnd(h.id);
    if (hf && hiddenFiles.has(hf)) { hiddenFiles.delete(hf); syncTreeStates(); refreshVisibility(); }
    if (h.id.startsWith('file:')) {
      const b = boxPos.get(h.id.slice(5));
      if (b.collapsed) toggleFold(b);
      wx = b.x + b.w / 2; wy = b.y + b.h / 2; el = b.el;
      select(h.id);
    } else {
      const p = fnPos.get(h.id);
      const b = boxPos.get(p.home);
      if (b.collapsed) toggleFold(b);
      wx = p.x + p.w / 2; wy = p.y + p.h / 2; el = p.el;
      select(h.id);
    }
    centerOn(wx, wy, 0.9);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    results.style.display = 'none';
  }

  // ---------- 边过滤 ----------
  $('#filterSeg').addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-k]');
    if (!btn) return;
    const k = btn.dataset.k;
    filters[k] = !filters[k];
    btn.classList.toggle('on', filters[k]);
    world.classList.toggle('showLocal', filters.local);
    drawEdges();
    applyVisibility();
  });

  // ---------- 按钮 / 快捷键 ----------
  $('#btnFit').addEventListener('click', fitView);
  $('#btnReset').addEventListener('click', () => {
    try { localStorage.removeItem(OFF_KEY); } catch (e) { /* ignore */ }
    location.reload();
  });
  window.addEventListener('keydown', (ev) => {
    if ((ev.key === 'f' || ev.key === 'F') && document.activeElement !== searchInput) fitView();
  });
  window.addEventListener('resize', () => { sizeCanvas(); sizeTrace(); drawEdges(); scheduleCull(); });

  // ---------- 启动 ----------
  setTimeout(() => {
    build();
    buildSidebar();
    applyVisibility();
    fitView();
    sizeCanvas();
    sizeTrace();
    drawEdges();
    warmPorts();
    renderStats();
    requestAnimationFrame(() => requestAnimationFrame(() => { const l = $('#loading'); if (l) l.remove(); }));
  }, 40);
})();
</script>
</body>
</html>
