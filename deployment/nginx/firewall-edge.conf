# ════════════════════════════════════════════════════════════════════
# 防火墙前端 + 挑战接口的边缘配置片段（同站反代 + 粗粒度限流）
# ════════════════════════════════════════════════════════════════════
#
# 这段是**片段**，不是完整站点配置：limit_req_zone 必须写在 http{} 里，
# 其余抄进你现有的 server{} 块。三处需要按部署改的地方标了 ⟨改⟩。
#
# ── 设计原则（读之前先认这条）──
#
#   **边缘只做无状态、粗粒度的判定；语义权威永远是应用层。**
#
#   · 应用层已经有：全局限流（enableRateLimit）、端点级限频（issue 10/min、
#     verify 20/min）、扫描陷阱、封禁、人机挑战。边缘再拦一遍的价值只有两个：
#     ① 在流量到达 Node 之前就掐掉明显的洪水（省 CPU）；② 兜住"应用层还没反应过来"
#     的突发。
#   · 所以这里的阈值刻意**比应用层宽 2 倍**：边缘先触发意味着"应用层还没记上账"，
#     而面板里看不到的 429 是最难排障的一类问题（用户说被拦，面板查无此人）。
#
#   一旦边缘比应用层严，就会出现：用户拿到 429 → 面板没有记录 → 运维只能猜。
#
# ── 与反向代理真实 IP 的关系（最容易踩死的一处）──
#
#   下面所有 proxy_set_header X-Forwarded-For 必须与后端的 `PROXY_TRUST_CIDR`
#   （或 trustProxy）**成对配置**。少了这一步，`request.ip` 会全是 127.0.0.1：
#     · 挑战绑定会退化（指纹含 IP → 一个人通过，120s 内全站共享通过态）
#     · 限流/封禁会误伤所有人（大家共用一个"IP"）
#   后端启动时会用 describeProxyTrustRisk() 在日志里提示这个风险，别忽略它。
#
# ════════════════════════════════════════════════════════════════════

# ── ① 限流区（必须放在 http{} 块内）────────────────────────────────
#
# challenge 端点：应用层是 issue 10/min + verify 20/min（每 IP、独立桶）。
# 这里给 40r/m ≈ 2 倍，只兜"明显不是人"的洪水；burst 20 让正常用户的手动重试
# 绝不会撞上（一次通过最多 2~3 次请求）。
limit_req_zone $binary_remote_addr zone=fw_challenge:10m rate=40r/m;

# 整个 API：应用层全局限流默认 600/min/IP。边缘给 1200r/m，同样是 2 倍。
# 如果你打算在面板里把 rateLimitRequests 调低，记得同步放宽这里（或干脆注释掉本条）。
limit_req_zone $binary_remote_addr zone=fw_api:10m rate=1200r/m;

# 单 IP 并发连接（防慢速攻击/连接占满）。与 defense.maxConn 默认 100 对齐再放宽。
limit_conn_zone $binary_remote_addr zone=fw_conn:10m;

# ── ② 明显恶意的请求直接断开（默认注释：先观察一个月再开）─────────────
#
# 444 是 nginx 的"不回包直接断"，比 403 更省资源，但也**完全不可观测**：
# 用户侧只有"连接被重置"，应用层没有记录。所以：
#   · 只在你有独立日志能对账时才启用；
#   · 匹配条件宁可窄，不要用宽泛的 UA 正则（会误杀脚本客户端、监控探针）。
#
# map $http_user_agent $fw_bad_ua {
#     default                 0;
#     ~*(sqlmap|nikto|nmap|masscan|acunetix|nessus)  1;
# }
#
# map $request_uri $fw_bad_path {
#     default                 0;
#     ~*/(\.git|\.svn|\.env|wp-admin|phpmyadmin)      1;
# }


server {
    listen 443 ssl;
    http2 on;
    server_name ⟨改: example.com⟩;

    # ⟨改: 证书路径⟩
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── ③ 前端产物（firewall/ 的 dist，由 CI 构建后 rsync 上来）──
    #
    # 前端是**独立构建**的静态站点，不进后端镜像（见 docs/deployment/docker.md）。
    # base 由 VITE_BASE 决定（默认 /firewall/），所以这里挂在哪个路径都行 ——
    # 后端生产代码里**零处**引用 /firewall/，换目录/换域名不需要改后端。
    root /srv/www/firewall;
    index index.html;

    location /firewall/ {
        # SPA 深链兜底：/firewall/settings 这类路由没有对应文件，回 index.html
        try_files $uri $uri/ /firewall/index.html;
    }

    # 挑战页本身**绝不能缓存**：它内联了本次的 challengeId/salt，
    # 缓存住等于把同一份题发给所有人（先解的通过，其余全 Expired）。
    location = /firewall/challenge.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 带 hash 的静态资源可以长缓存（文件名变了 URL 就变）
    location /firewall/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── ④ 挑战接口：单独限流 + 禁缓存 ──
    #
    # 这两个端点免登录、会写 Redis（issue 每签一份就是一次写入），是**唯一需要
    # 边缘另眼相看**的路径。no-store 尤其重要：如果被 CDN/代理缓存了 302 或 428，
    # 所有人会拿到同一个响应。
    location ^~ /api/firewall/v1/challenge/ {
        limit_req zone=fw_challenge burst=20 nodelay;
        limit_conn fw_conn 50;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 真实 IP（与后端 PROXY_TRUST_CIDR 成对；缺了就等于关掉按 IP 的整套防护）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端已经带了 no-store；这里再显式告诉边缘"别缓存、别改写"
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── ⑤ 其余 API：同源反代 ──
    #
    # `^~` 前缀匹配一旦命中就不再回退到上面的 try_files，
    # 因此 SPA 的兜底不会把 /api/xxx 也吃掉。
    location ^~ /api/ {
        limit_req zone=fw_api burst=200 nodelay;
        limit_conn fw_conn 100;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（若启用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 大文件上传/导出：与后端 requestTimeout 对齐，别让边缘先断
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # ── ⑥ 可选：恶意 UA / 路径直接断（与 ② 的 map 配套，默认关闭）──
    # if ($fw_bad_ua)  { return 444; }
    # if ($fw_bad_path) { return 444; }

    # ── ⑦ 日志（排障时唯一能对账的东西）──
    # 边缘拒绝不会进面板，所以这里的 access log 必须留：
    # 用户反馈"被拦了"而面板查不到人时，第一现场就是它。
    access_log /var/log/nginx/firewall.access.log;
    error_log  /var/log/nginx/firewall.error.log warn;
}

# WebSocket Upgrade 的 map（放在 http{} 里，与上面的限流区同层）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
