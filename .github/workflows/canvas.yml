# ============================================================================
# 调用图数据刷新 —— 每次推送到 main 自动重扫 src/ 并回提交快照
#
# 产出物（已入库）：
#   docs/public/canvas/index.html  页面（纯静态，无构建依赖）
#   docs/public/canvas/data.js     数据快照（本工作流生成）
#   scripts/canvas/scan.mjs        扫描器（acorn 静态解析，不启动服务、不连库）
#
# 发布链路：
#   push(src/**) → 本工作流重扫 → 提交 docs/public/canvas/data.js
#   → docs/** 变化 → docs.yml 重新构建并发布 → https://yijiu2025.github.io/CoreFlow/canvas/
#
# 为什么不会自激循环：
#   本工作流的 paths 只包含 `src/**` 与扫描器自身；它提交的文件只有
#   `docs/public/canvas/data.js`，不匹配自己的 paths ⇒ 不会再触发自己。
#   而 docs.yml 的 paths 含 `docs/**` ⇒ 正好接着发布，这是期望行为。
#   ci.yml 的 push 触发加了 `paths-ignore: docs/public/canvas/data.js`，
#   避免纯数据提交又把整套 Jest/verify 跑一遍。
#
# 为什么每周还要跑一次：src 不变时数据不会过期，但 acorn 版本 / Node 版本
# 或扫描器修 bug 后，靠 schedule 兜底也能把线上数据带到最新规则。
# ============================================================================

name: Canvas Data

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/canvas/**'
      - '.github/workflows/canvas.yml'
  schedule:
    # 每周一 04:00（UTC+8）兜底刷新一次
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: canvas-data
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  refresh:
    name: 重扫 src/ 并提交数据
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 扫描器只依赖 acorn（eslint 的传递依赖，安装口径与 ci.yml 保持一致）
      - name: 安装依赖
        run: |
          npm install --workspace=packages/shared-device --include-workspace-root \
            --ignore-scripts --legacy-peer-deps --no-package-lock --no-audit --no-fund

      - name: 重新扫描 src/
        run: node scripts/canvas/scan.mjs

      - name: 提交数据快照
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/public/canvas/data.js; then
            echo "✅ 调用图数据无变化，无需提交"
            exit 0
          fi
          git add docs/public/canvas/data.js
          git commit -m "chore(canvas): 刷新调用图数据快照"
          git push
          echo "✅ 已提交，docs.yml 会自动重新发布站点"
