# ============================================================================
# CI —— 提交门禁
#
# 四条作业，对应四类"本可以拦住"的回归：
#   lint      → 后端风格与约定（导出位置、禁 console、prettier）
#   test      → 后端单元 / 契约 / 结构守卫（Jest）
#   frontend  → oauth21 前端（类型 / 规范 / 单测 / 生产构建）
#   verify    → 跨进程不变量（分布式锁、WS 扇出、遥测聚合）—— 只能多进程验证
#
# 关于依赖安装：分两类作业，口径**刻意不同**。
#
#   【前端 frontend job】用 `npm ci --prefix oauth21`。
#     oauth21 是独立前端工程，有自己的 `oauth21/package-lock.json`（已入库），
#     它的依赖图与根工程完全无关（不引用 `wb-logkit` 那条 link），所以 `npm ci`
#     能正常同步校验并安装。lock 入库后这一步才成立 —— 此前 lock 被 .gitignore
#     无差别排除，只能 `npm install`，构建不可复现。
#
#   【后端 lint / test / verify 三个 job】**继续用 `npm install`，不要改 `npm ci`**。
#     根 `package-lock.json` 已入库（供应链审计基线），但它把 `wb-logkit` 记为
#     `link: packages/log` —— 那是个被 .gitignore 排除的独立嵌套仓库
#     （https://github.com/yijiu2025/log），CI 检出主仓后并不存在。
#     实测（2026-09-28）：`npm ci --workspace=packages/shared-device --include-workspace-root`
#     本身能装上（exit 0，736 包），但 npm **会照样给 `node_modules/wb-logkit` 建一条
#     指向 `packages/log` 的**悬空软链**，`import 'wb-logkit'` 立即 `ERR_MODULE_NOT_FOUND`
#     → 后端三个 job 齐红。所以根 lock 是"给人/审计看的基线"，不是后端安装路径。
#
#   安装范围 = `--workspace=packages/shared-device --include-workspace-root`：
#     只把「根工程 + shared-device 这一个 workspace」纳入安装，
#     oauth21 / posecraft / firewall 三个前端工程（vue / vite / vitest…）不进图。
#   ⚠️ 不要改回 `--workspaces=false`（踩过）：那个值会让 npm 对
#     「既由某个 workspace 提供、又是根依赖」的包名两头落空 —— 既不建软链，
#     也不去 registry 取。`stable-deviceid` 恰好就是这种情况（提供者是
#     `packages/shared-device`，而 checkout 里它确实存在），后果是
#       Cannot find module 'stable-deviceid/base62-timestamp'
#     让 14 个套件 failed to run。实测 2026-09-21。
#
#   装完还要构建一次 shared-device 的 dist：
#     `dist/` 是构建产物、不入库，而 `src/framework/auth/device-id-service.js`
#     要 import `stable-deviceid/base62-timestamp`，包的 exports 指向
#     `./dist/base62-timestamp.js`。只跑 build.mjs 即可（esbuild 由根依赖
#     vitepress→vite 带进来，能从根 node_modules 解析到）；同一条命令里链的
#     tsc 只产出 .d.ts，CI 不需要它。
#
#   `--ignore-scripts`：根 `prepare` 是 husky，CI 不需要 git hooks，且能挡掉 postinstall 供应链面。
#
#   `--legacy-peer-deps`：后端三个 job 没有它必崩 —— 它不是在"放宽校验"，是在绕开
#     npm 10 / @npmcli/arborist 的一个崩溃：
#       npm error Cannot read properties of null (reading 'edgesOut')
#     成因链（2026-09-21 逐条实测）：
#       1. 本仓库的依赖安装路径刻意不依赖 lockfile → CI 上 npm 必须从 registry 现算整棵理想树；
#       2. 三个前端 workspace 的 devDependencies 也在这个图里
#          （崩溃日志最后两条正是 `fetch manifest vitest@4.1.11` 与其 peer `@types/node`）；
#       3. vitest 的 peer 集合让 arborist 走到 `#loadPeerSet`
#          （build-ideal-tree.js:1289）里的 `node.parent.edgesOut`，而该处 parent 为 null
#          → TypeError，安装以退出码 1 结束。
#     为什么它有效：`legacyPeerDeps` 让 arborist **根本不创建 peer 边**
#       （arborist/lib/node.js:881 用 `!this.legacyPeerDeps` 门禁了整段 peerDependencies
#       装载），于是 #loadPeerSet 里待遍历的 peerEdges 恒为空，那行 null 解引用不可达。
#     已实测：`--workspaces=false` 单用崩、去掉 workspace 相关标志也崩、
#       `--workspace=…` 定向安装**不带**这个标志同样崩；带上后 687 个包 3 分钟内装完。
#     Dockerfile 那边不需要它：`--omit=dev` 让 vitest 这类 devDependency 不进图，
#       所以镜像一直是能构建的（这也解释了为什么"镜像能构建"却"CI 装不上"）。
#
# ⚠️ 后端三个 job 的 setup-node **仍然不能开 `cache: npm`**。
#   缓存 key 由根 `package-lock.json` 的哈希算出 —— 该文件现已入库，看似可以开，
#   但缓存恢复后仍要走 `npm install`（见上：后端不能用 ci），而 `cache: npm` 的
#   收益只在 `npm ci` 路径上才成立；开着它只会给一个命中率无意义的缓存目录。
#   真要开，必须先让后端也具备 `npm ci` 能力（= 让 `packages/log` 在 CI 里存在）。
#   **frontend job 可以考虑开 `cache: npm` + `cache-dependency-path: oauth21/package-lock.json`**，
#   因为那一条走的正是 `npm ci`。
#
# 关于数据库：**测试作业不需要 MySQL/Redis**。
#   这不是省事，是实测结论 —— `framework/db` 在测试环境检测到缺配置会跳过而非退出，
#   访问层则降级到进程内 MapStore，本机无 DB/Redis 时 1066 个用例全绿。
#   给 CI 硬塞 services 只会让流水线更慢、更脆。
#   （需要真实 Redis 的检查在 verify 作业里，那里才起 service。）
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时取消上一次：让人只看得到最新一次结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # 1. 风格与约定
  # --------------------------------------------------------------------------
  lint:
    name: Lint（约定守卫）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        # ⚠️ 用 `npm install` 而非 `npm ci`：根 lock 把 `wb-logkit` 记为 link→packages/log，
        #    而该目录是 .gitignore 排除的嵌套仓、CI 里不存在；`npm ci` 会建出悬空软链，
        #    `import 'wb-logkit'` 直接 ERR_MODULE_NOT_FOUND。详见文件头注释。实测 2026-09-28。
        run: |
          npm install --workspace=packages/shared-device --include-workspace-root \
            --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node packages/shared-device/scripts/build.mjs

      # 只扫"我们维护的代码"：
      #   src/ 是产品代码，scripts/ migrations/ docker/ 是交付的一部分；
      #   仓库里还住着 phonecopy 等 8 万文件的第三方快照与三个独立前端工程，
      #   它们各有自己的构建，扫进来只会让这条流水线常年红灯。
      - name: ESLint
        run: npx eslint src scripts migrations docker index.js

  # --------------------------------------------------------------------------
  # 2. 单元 / 契约 / 结构守卫
  # --------------------------------------------------------------------------
  test:
    name: Test（Jest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        # ⚠️ 同 lint job：后端保持 `npm install`，理由见文件头注释（wb-logkit 悬空软链）。
        run: |
          npm install --workspace=packages/shared-device --include-workspace-root \
            --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node packages/shared-device/scripts/build.mjs

      # 必须带 --experimental-vm-modules：项目是 ESM 且测试大量使用
      # jest.unstable_mockModule，直接 npx jest 会丢掉这个标志而大面积失败。
      - name: 运行测试
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js --ci

  # --------------------------------------------------------------------------
  # 2.5 oauth21 前端（类型 / 规范 / 单测 / 生产构建）
  #
  # 为什么此前完全没有这条作业：三个前端工程（oauth21 / posecraft / firewall）
  # 各有自己的构建与依赖，而 CI 的依赖安装刻意只装 `packages/shared-device` 一个
  # workspace（见文件头注释），所以前端的 vue-tsc / eslint / build 在 CI 上一次
  # 都没跑过 —— 本地能过靠的是人记得手动跑。这里补上 oauth21 的闸门。
  #
  # oauth21 是**独立前端项目**（有自己的 package.json / node_modules / lock），
  # 不是 workspace 成员，因此用 `npm ci --prefix oauth21` 独立安装，而不是
  # `--workspace=oauth21`。
  #
  # 🔴 **用 `npm ci` 而非 `npm install`**：lock 已入库（2026-09-28 起），
  #    这一步从 registry 现算树变成严格按 lock 复现，构建可复现、供应链有基线。
  #    两个本地包 `skinsuite` / `stable-deviceid` 现已**显式声明在
  #    `oauth21/package.json` 的 dependencies 里**（作为「可解析性声明」，不再是幽灵依赖），
  #    因此 lock 里带它们的 resolved + integrity，`npm ci` 能正常同步校验。
  #    ⚠️ 但运行期解析仍走 `vite.config.js` 的 resolve.alias 直指
  #      `../packages/*/src/index.ts`（源码直供，优先于 node_modules 里的 dist 版本）。
  #      所以真装进来的 npm 版只是"让 lock/审计说得通"，不参与构建产物。
  # ⚠️ `packages/theme-core` 是 **git submodule**（.gitmodules → yijiu2025/theme.git），
  #    vite alias 直指它的 `src/index.ts` —— checkout 必须带 `submodules: recursive`，
  #    否则该目录是空的、type-check / build 直接失败。
  #
  # 为什么不用 `--legacy-peer-deps`：这条路径是 `npm ci`，按 lock 精确安装、
  # 不重新求解 peer；文件头记录的 arborist 崩溃只发生在 `npm install` 现算理想树时。
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend（oauth21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # lock 已入库 → 这条路径是 `npm ci`，缓存命中是有意义的
          cache: npm
          cache-dependency-path: oauth21/package-lock.json

      - name: 安装依赖（lock 复现）
        run: npm ci --prefix oauth21 --ignore-scripts --no-audit --no-fund

      # 顺序刻意按「类型 → 规范 → 单测 → 构建」：
      # 类型错是最便宜的（不进构建），先挡；构建最贵（含 type-check），放最后兜底。
      - name: 类型检查（vue-tsc -b）
        run: npm run type-check --prefix oauth21

      - name: ESLint
        run: npm run lint --prefix oauth21

      - name: 单元测试（vitest）
        run: npm run test --prefix oauth21

      - name: 生产构建
        run: npm run build --prefix oauth21

      # 静态验收关卡（不需要 dev server / 浏览器）——把「配置写错但无声」的那一类挡在 CI。
      # 为什么挑这三个进 CI：
      #   verify-alias-single-source  → 别名三处漂移（vite/tsconfig/aliases.ts），此前只能靠人记
      #   verify-kernel-zero-coupling → 内核包若 import vue 会静默出两份 Vue，npm/构建都不报
      #   verify-console-strip        → Vite 8 下 `build.esbuild.drop` 静默失效（实测残留 28 处），
      #                                 本关卡自建一次构建扫产物，属"以为有其实没有"的典型
      # ⚠️ 其余关卡（verify-theme-dirs / verify-glob-device / verify-no-pwa）暂未进 CI：
      #    theme-dirs / glob-device 依赖本地子模块与主题目录的完整形态，可在后续按需补；
      #    verify-no-pwa 需要 dist-nopwa 产物（当前 CI 只产出默认 dist）。
      - name: 静态验收关卡
        run: |
          node oauth21/e2e/verify-alias-single-source.mjs
          node oauth21/e2e/verify-kernel-zero-coupling.mjs
          node oauth21/e2e/verify-console-strip.mjs

  # --------------------------------------------------------------------------
  # 3. 跨进程不变量（E1 分布式锁 / E3 遥测聚合 / E3 WS 扇出）
  #
  # 为什么值得单独一条作业：这三种行为在单进程里都能被单例状态"伪装成正确"，
  # 只有真实多进程 + 真实 Redis 才能证伪。它们此前只靠人记得手动跑 ——
  # 结果就是长期没人跑。放进 CI 才算真正有了门禁。
  # --------------------------------------------------------------------------
  verify:
    name: Verify（跨进程关卡）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        # ⚠️ 同 lint job：后端保持 `npm install`，理由见文件头注释（wb-logkit 悬空软链）。
        run: |
          npm install --workspace=packages/shared-device --include-workspace-root \
            --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node packages/shared-device/scripts/build.mjs

      # 关卡用 process.loadEnvFile() 自己读 env 文件（因为 npm run 会丢命令行变量），
      # 而 CI 里没有被 gitignore 的 .env。用 VERIFY_ENV_FILE 指向临时文件即可，
      # 无需迁就默认路径 —— 这条通道是关卡刻意留出来的。
      - name: 准备关卡环境
        run: |
          cat > ci-verify.env <<'EOF'
          REDIS_ENABLED=true
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF

      # 退出码语义（刻意区分环境与回归，见 scripts/verify/README.md）：
      #   0 通过 / 1 断言失败 / 2 回滚不完整 / 3 环境不可用
      # 在 CI 里 3 也必须失败 —— service 是我们自己声明的，取不到只可能是流水线坏了，
      # 而不是"环境问题可以放过"。区别在于给出不同的排障提示。
      - name: 运行跨进程关卡
        env:
          VERIFY_ENV_FILE: ci-verify.env
        run: |
          set +e
          failed=0
          for k in lock-mutex ws-fanout stats-aggregation; do
            echo "=== $k ==="
            node "scripts/verify/$k.mjs"
            code=$?
            case $code in
              0) echo "✅ $k 通过" ;;
              1) echo "❌ $k 断言失败（真回归，查代码）"; failed=1 ;;
              2) echo "🚨 $k 回滚不完整，需人工检查数据"; failed=1 ;;
              3) echo "⛔ $k 环境不可用（CI 的 service 没起来？）"; failed=1 ;;
              *) echo "❓ $k 异常退出码 $code"; failed=1 ;;
            esac
          done
          exit $failed
