version: 2

updates:
  # npm 依赖。
  # 只覆盖仓库根的清单：前端工作区（oauth21 / posecraft / firewall / admin / poseadmin）
  # 已于 2026-10-31 拆为独立仓库移出本仓，各自的依赖更新在各自仓库里跑。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # 默认上限 5 是告警只开出 4 个 PR 的原因；分组后提上限，让排队中的更新流动起来
    open-pull-requests-limit: 15

    # ── overrides 已修到修复版的两条，不再 ignore ──────────────────────
    # minimatch / glob 过去因为「没有可用修复路径」被 ignore，2026-11-01 复核后已解除：
    #   · minimatch → overrides.minimatch = ^11.0.3，修 GHSA-g3hv-75wg-m249
    #   · glob      → overrides.glob = ^14.0.3，修 GHSA-3g3m-2fjr-6pw4
    # 早期结论「全局 override minimatch@^11 会让 jest --coverage 崩在
    # generateEmptyCoverage（minimatch is not a function）」已不成立：把
    # brace-expansion 一并 override 到 ^5.0.6 之后，jest 30 / eslint 10 / nodemon
    # 三套工具链的全量用例（1273 条）与 `--coverage` 都能通过。
    # 所以这里不再留 ignore —— 留着会让后续针对这两个包的安全更新被静默吞掉。
    #
    # deepmerge 仍然 ignore：GHSA-gcqx-w48m-w2h4（mergeObject 原型污染）至今没有修复版，
    # 只能等上游；它仅经 jest-config 进入 dev 链路（Dockerfile 用 --omit=dev，不进镜像），
    # 是 `npm audit` 里唯一残留的 low。
    # 解除条件：上游发布修复版后删掉这一行，并跑一次 `npm audit`。
    #
    # uuid 只锁 major（minor / patch 照常自动更新）：uuid 14 的 node 入口是纯 ESM
    # （dist-node/index.js），而 sequelize 6 是 CJS，`require('uuid')` 在 jest 的
    # vm-modules 运行时里直接抛
    #   Cannot require() ES Module ... in a cycle (from sequelize/lib/utils.js)
    # → 3 个 test suite `failed to run`（2026-11-01 实测）。生产侧 Node 24 的
    # require(esm) 能加载它，但"测试红、上线绿"这种分裂不值得赌。
    # 解除条件：sequelize 升到原生 ESM 的 7.x，或 uuid 恢复 CJS 入口。
    ignore:
      - dependency-name: deepmerge
      - dependency-name: uuid
        update-types:
          - version-update:semver-major

    # `uuid` 的 override 写成了 `"$uuid"`（见 package.json），即"覆盖值 = 直接依赖的声明值"。
    # 这样 sequelize 想要的 uuid@8 仍会被顶到根版本，但覆盖值不再写死 —— 显式写
    # `^11.1.1` 时，Dependabot 想把 uuid 升大版本会撞上
    # `Override for uuid@14.0.3 conflicts with direct dependency`，让整批 npm 更新
    # job 直接失败（2026-11-01 实测）。`$uuid` 由 npm 在解析时展开，直接依赖改了它自动跟随。

    groups:
      # 次版本 / 补丁按生产、开发分组，一次一个 PR，降低评审噪音
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 大版本不分组：逐个评审（Breaking change 风险）

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai

  # Docker 基础镜像（Dockerfile 在仓库根）
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
