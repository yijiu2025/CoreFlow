version: 2

updates:
  # npm 依赖。
  # 只覆盖仓库根的清单：前端工作区（oauth21 / posecraft / firewall / admin / poseadmin）
  # 已于 2026-10-31 拆为独立仓库移出本仓，各自的依赖更新在各自仓库里跑。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # 默认上限 5 是告警只开出 4 个 PR 的原因；分组后提上限，让排队中的更新流动起来
    open-pull-requests-limit: 15

    # ── 上游未跟进的三条，别让 Dependabot 反复开失败的 job ──────────────
    # 症状：这三条的 security update 跑完必红（`Dependabot encountered '1' error(s)`），
    # 而且**没有可用修复路径** —— 例：minimatch 的唯一"修复"路径要求把 @eslint/js 从
    # 10.0.1 降到 9.39.5；glob 的修复版要 rimraf@3 / test-exclude 放弃 `glob.sync`。
    # 本仓已用 overrides 把**生产链路**修到 0（见 package.json `overrides`），
    # 剩下的副本全部只在 devDependency 里（jest 30 / eslint 10），且 Dockerfile
    # 是 `npm install --omit=dev` —— 它们不进镜像。
    #
    # ⚠️ 解除条件（满足后请删掉对应 ignore 并跑一次 `npm audit`）：
    #   · jest 发布版本改用 glob ≥14 / minimatch ≥11
    #   · eslint 发布版本改用 minimatch ≥11
    # 现在硬压会打碎工具链：全局 override `minimatch@^11` 实测让 `jest --coverage`
    # 崩在 generateEmptyCoverage（`minimatch is not a function`，v11 的 CJS 导出形态变了）。
    ignore:
      - dependency-name: minimatch
      - dependency-name: glob
      - dependency-name: deepmerge

    # `uuid` 没有列进 ignore：它的 override 写成了 `"$uuid"`（见 package.json），
    # 即"覆盖值 = 直接依赖的声明值"。这样 sequelize 的 uuid@8 仍会被顶到根版本，
    # 但覆盖值不再是一个写死的范围 —— 显式写 `^11.1.1` 时，Dependabot 想把 uuid 升到
    # 大版本会撞上 `Override for uuid@14.0.3 conflicts with direct dependency`，
    # 导致整批 npm 更新 job 失败（2026-11-01 实测）。`$uuid` 由 npm 在解析时展开，
    # 直接依赖改了它自动跟随。

    groups:
      # 次版本 / 补丁按生产、开发分组，一次一个 PR，降低评审噪音
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 大版本不分组：逐个评审（Breaking change 风险）

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai

  # Docker 基础镜像（Dockerfile 在仓库根）
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
